<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>갤벤 레이스</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,"Noto Sans KR",sans-serif;
      background:linear-gradient(180deg,#89d7ff 0%,#c8f0ff 35%,#7cc46a 35%,#5aa14a 100%);
      color:#1f2430;
    }
    .wrap{max-width:1400px;margin:auto;padding:18px}
    .title{font-size:40px;font-weight:900;text-align:center;margin:4px 0 8px}
    .sub{text-align:center;margin-bottom:14px;color:#234}
    .panel{
      background:#ffffffee;
      border-radius:22px;
      padding:16px;
      margin-bottom:14px;
      box-shadow:0 8px 22px #0002;
      border:2px solid #ffffff;
    }
    .controls{
      display:grid;
      grid-template-columns:1fr 2fr repeat(4,auto);
      gap:8px;
      align-items:center;
    }
    input,button{
      font:inherit;
      padding:12px 14px;
      border-radius:12px;
      border:2px solid #d7dfe9;
    }
    input{background:#fff}
    button{
      border:0;
      font-weight:900;
      cursor:pointer;
    }
    .btn-load{background:#ffd65b}
    .btn-start{background:#ff8c8c}
    .btn-reset{background:#ddd}
    .btn-music{background:#b7d7ff}
    .status{margin-top:10px;text-align:center;font-weight:900}
    .substatus{margin-top:6px;text-align:center;font-size:13px;color:#5a6475}
    .scenePanel{padding:10px}
    #sceneWrap{
      position:relative;
      width:100%;
      height:72vh;
      min-height:520px;
      border-radius:20px;
      overflow:hidden;
      background:linear-gradient(180deg,#8fd9ff 0%,#daf7ff 40%,#88cf74 40%,#64ad52 100%);
    }
    #scene{width:100%;height:100%;display:block}
    .overlay{
      position:absolute;inset:0;
      pointer-events:none;
    }
    .timerBadge{
      position:absolute;top:14px;left:14px;
      background:#ffffffdd;
      border-radius:14px;
      padding:10px 14px;
      font-size:22px;
      font-weight:900;
      box-shadow:0 4px 14px #0002;
    }
    .infoBadge{
      position:absolute;top:14px;right:14px;
      background:#ffffffdd;
      border-radius:14px;
      padding:10px 14px;
      font-size:14px;
      font-weight:800;
      box-shadow:0 4px 14px #0002;
      text-align:right;
      line-height:1.5;
    }
    .winnerBanner{
      position:absolute;
      left:50%;bottom:18px;transform:translateX(-50%);
      background:#fff2a8ee;
      border:2px solid #ffe16b;
      border-radius:18px;
      padding:16px 26px;
      font-size:28px;
      font-weight:900;
      box-shadow:0 8px 18px #0002;
      display:none;
    }
    .lower{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:14px;
    }
    .listBox{
      max-height:360px;
      overflow:auto;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      gap:8px;
      margin-top:10px;
    }
    .person{
      background:#f4f6f8;
      border-radius:10px;
      padding:8px 10px;
      font-size:13px;
      font-weight:700;
    }
    .note{
      font-size:13px;color:#677080;line-height:1.6
    }
    .ranking{
      max-height:360px;
      overflow:auto;
      margin-top:10px;
    }
    .rankRow{
      display:flex;justify-content:space-between;gap:10px;
      padding:8px 10px;border-radius:10px;background:#f8f8f8;margin-bottom:6px;
      font-size:13px;font-weight:800;
    }
    .rankRow.top1{background:#fff0a8}

    .myPigControls{
      display:flex;
      gap:8px;
      margin-top:10px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .myPigControls input{
      width:min(360px,100%);
    }
    .btn-my{background:#ffc7df}
    .btn-all{background:#cfe8ff}
    .myPigBadge{
      position:absolute;
      left:50%;
      top:14px;
      transform:translateX(-50%);
      background:#ffedf5ee;
      border:2px solid #ff9fc6;
      border-radius:15px;
      padding:9px 14px;
      font-weight:900;
      font-size:15px;
      box-shadow:0 4px 14px #0002;
      display:none;
    }
    .top10Box{
      position:absolute;
      right:14px;
      top:88px;
      width:190px;
      max-height:300px;
      overflow:hidden;
      background:#ffffffde;
      border-radius:14px;
      padding:9px;
      box-shadow:0 4px 14px #0002;
      font-size:12px;
      font-weight:800;
      pointer-events:none;
    }
    .top10Title{font-size:13px;font-weight:900;margin-bottom:5px;text-align:center}
    .top10Row{
      display:flex;
      justify-content:space-between;
      gap:6px;
      padding:3px 5px;
      border-radius:7px;
      background:#f7f8fa;
      margin-bottom:3px;
    }
    .top10Row.me{background:#ffd7e8}
    @media (max-width:1100px){
      .controls{grid-template-columns:1fr 1fr;gap:8px}
      #sceneWrap{height:64vh;min-height:480px}
      .lower{grid-template-columns:1fr}
    }
    @media (max-width:700px){
      .controls{grid-template-columns:1fr}
      .title{font-size:30px}
      .winnerBanner{font-size:21px;width:calc(100% - 24px);text-align:center}
      .timerBadge{font-size:18px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="title">🏁 갤벤 레이스 🐷</div>
  <div class="sub">디시 갤벤 글 댓글 작성자가 자동 참가 · 두발로 뛰는 돼지 3D 레이스</div>

  <div class="panel">
    <div class="controls">
      <input id="key" type="password" placeholder="운영자 ADMIN_KEY">
      <input id="post" placeholder="디시 갤벤 게시글 주소">
      <button class="btn-load" onclick="loadComments()">🐷 댓글 불러오기</button>
      <button class="btn-start" onclick="startRace()">🏁 레이스 시작</button>
      <button class="btn-reset" onclick="resetRace()">초기화</button>
      <button class="btn-music" id="musicBtn" onclick="toggleMusic()">🎵 음악 ON</button>
    </div>
    <div class="status" id="status">참가자 0 / 200명</div>
    <div class="substatus" id="substatus">댓글을 불러오면 참가자가 자동 등록됩니다.</div>
    <div class="myPigControls">
      <input id="myPigName" placeholder="내 닉네임 입력">
      <button class="btn-my" onclick="findMyPig()">🐷 내 돼지 보기</button>
      <button class="btn-all" onclick="showAllPigs()">🏁 전체보기</button>
    </div>
  </div>

  <div class="panel scenePanel">
    <div id="sceneWrap">
      <canvas id="scene"></canvas>
      <div class="overlay">
        <div class="timerBadge" id="timer">대기 중</div>
        <div class="myPigBadge" id="myPigBadge"></div>
        <div class="infoBadge" id="sceneInfo">참가자 0명<br>30초 레이스</div>
        <div class="top10Box" id="top10Box"><div class="top10Title">TOP 10</div><div id="top10List">레이스 대기중</div></div>
        <div class="winnerBanner" id="winnerBanner"></div>
      </div>
    </div>
  </div>

  <div class="lower">
    <div class="panel">
      <b>🐷 참가자 명단</b>
      <div class="listBox" id="list"></div>
    </div>

    <div class="panel">
      <b>🏆 최종 순위</b>
      <div class="ranking" id="ranking"></div>
      <div class="note" style="margin-top:10px">
        - 같은 사람은 1마리만 참가<br>
        - 최대 200명까지 참가<br>
        - 1등 돼지는 골인 후 춤춤<br>
        - 음악은 <b>public/race.mp3</b> 넣으면 재생됨
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.166.1/build/three.module.js';

const $ = id => document.getElementById(id);

let state = { racers: [], race: null };
let scene, camera, renderer, clock;
let pigs = [];
let worldGroup = null;
let lastSignature = '';
let musicEnabled = true;
let finishShown = false;
let selectedPigName = localStorage.getItem('galvent_my_pig') || '';
let cameraMode = selectedPigName ? 'mine' : 'all';
const durationMs = 30000;
const bgm = new Audio('/race.mp3');
bgm.loop = true;
bgm.volume = 0.55;

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(url,opt={}){
  const r = await fetch(url,opt);
  const d = await r.json().catch(()=>({error:'서버 응답 오류'}));
  if(!r.ok) throw Error(d.error || '오류가 발생했습니다.');
  return d;
}

function setStatus(t){ $('status').textContent = t; }
function setSub(t){ $('substatus').textContent = t; }

function initScene(){
  const canvas = $('scene');
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize($('sceneWrap').clientWidth, $('sceneWrap').clientHeight, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xdff6ff, 40, 140);

  camera = new THREE.PerspectiveCamera(
    42,
    $('sceneWrap').clientWidth / $('sceneWrap').clientHeight,
    0.1,
    400
  );
  camera.position.set(15, 28, 34);
  camera.lookAt(6, 0, 0);

  clock = new THREE.Clock();

  const hemi = new THREE.HemisphereLight(0xffffff, 0x6dbd66, 1.2);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 1.25);
  dir.position.set(15, 30, 16);
  dir.castShadow = true;
  dir.shadow.mapSize.set(2048,2048);
  dir.shadow.camera.left = -80;
  dir.shadow.camera.right = 80;
  dir.shadow.camera.top = 80;
  dir.shadow.camera.bottom = -80;
  scene.add(dir);

  window.addEventListener('resize', onResize);
  animate();
}

function onResize(){
  const w = $('sceneWrap').clientWidth;
  const h = $('sceneWrap').clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function makeLabel(text){
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 128;
  const ctx = c.getContext('2d');

  ctx.fillStyle = 'rgba(255,255,255,0.96)';
  roundRect(ctx, 0, 18, 512, 84, 24);
  ctx.fill();

  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 3;
  roundRect(ctx, 1.5, 19.5, 509, 81, 22);
  ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.font = 'bold 42px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const clipped = text.length > 14 ? text.slice(0,14) + '…' : text;
  ctx.fillText(clipped, 256, 60);

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4.8, 1.2, 1);
  return sprite;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}


function makeMyMarker(){
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 160;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(255,236,246,0.98)';
  roundRect(ctx, 12, 22, 488, 110, 34);
  ctx.fill();
  ctx.strokeStyle = '#ff5fa3';
  ctx.lineWidth = 8;
  roundRect(ctx, 12, 22, 488, 110, 34);
  ctx.stroke();
  ctx.fillStyle = '#ff297f';
  ctx.font = '900 45px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⭐ 내 돼지', 256, 77);
  const tex = new THREE.CanvasTexture(c);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sprite.scale.set(4.8,1.5,1);
  sprite.position.set(0,3.2,0);
  sprite.visible = false;
  return sprite;
}

function createPig(name, index, total, laneZ, startX, finishX){
  const g = new THREE.Group();

  const skin = new THREE.MeshStandardMaterial({color:0xf4b29a, roughness:0.9, metalness:0.02});
  const skin2 = new THREE.MeshStandardMaterial({color:0xe89a85, roughness:0.92, metalness:0.02});
  const noseMat = new THREE.MeshStandardMaterial({color:0xd97c75, roughness:0.95});
  const eyeWhite = new THREE.MeshStandardMaterial({color:0xffffff});
  const eyeBlack = new THREE.MeshStandardMaterial({color:0x111111});
  const hoofMat = new THREE.MeshStandardMaterial({color:0x6f4a3b, roughness:1});
  const shoeMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.9});
  const soleMat = new THREE.MeshStandardMaterial({color:0xe04c4c, roughness:0.9});

  const outfitColors = [0x4f8cff,0x3ec46d,0xf04f62,0xffb340,0xa95cff,0x00b8b8,0xff7aa2,0x8bc34a];
  const outfit = new THREE.MeshStandardMaterial({
    color: outfitColors[index % outfitColors.length],
    roughness: 0.85,
    metalness: 0.03
  });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.72, 24, 24), outfit);
  body.scale.set(1.05, 1.15, 0.9);
  body.position.set(0, 0.08, 0);
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.48, 20, 20), skin);
  belly.scale.set(1.0, 1.08, 0.78);
  belly.position.set(0.08, -0.08, 0);
  belly.castShadow = true;
  g.add(belly);

  const chest = new THREE.Mesh(new THREE.SphereGeometry(0.55, 20, 20), outfit);
  chest.scale.set(0.95, 0.95, 0.82);
  chest.position.set(0.22, 0.24, 0);
  chest.castShadow = true;
  g.add(chest);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.48, 24, 24), skin);
  head.scale.set(1.0, 0.95, 0.95);
  head.position.set(0.88, 0.5, 0);
  head.castShadow = true;
  head.receiveShadow = true;
  g.add(head);

  const snout = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.26, 18), skin2);
  snout.rotation.z = Math.PI / 2;
  snout.position.set(1.24, 0.34, 0);
  snout.castShadow = true;
  g.add(snout);

  const nostril1 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 10, 10), noseMat);
  const nostril2 = nostril1.clone();
  nostril1.position.set(1.36, 0.34, -0.05);
  nostril2.position.set(1.36, 0.34, 0.05);
  g.add(nostril1, nostril2);

  const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), eyeWhite);
  const eye2 = eye1.clone();
  eye1.position.set(1.02, 0.55, -0.16);
  eye2.position.set(1.02, 0.55, 0.16);
  g.add(eye1, eye2);

  const pupil1 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 10, 10), eyeBlack);
  const pupil2 = pupil1.clone();
  pupil1.position.set(1.08, 0.53, -0.16);
  pupil2.position.set(1.08, 0.53, 0.16);
  g.add(pupil1, pupil2);

  const earGeo = new THREE.ConeGeometry(0.11, 0.24, 4);
  const earL = new THREE.Mesh(earGeo, skin2);
  const earR = earL.clone();
  earL.position.set(0.72, 0.9, -0.2);
  earR.position.set(0.72, 0.9, 0.2);
  earL.rotation.z = -0.65;
  earL.rotation.x = -0.25;
  earR.rotation.z = -0.65;
  earR.rotation.x = 0.25;
  g.add(earL, earR);

  const armPivotL = new THREE.Group();
  const armPivotR = new THREE.Group();
  armPivotL.position.set(0.36, 0.22, -0.36);
  armPivotR.position.set(0.36, 0.22, 0.36);
  g.add(armPivotL, armPivotR);

  const armGeo = new THREE.CapsuleGeometry(0.08, 0.42, 6, 10);
  const leftArm = new THREE.Mesh(armGeo, skin);
  const rightArm = new THREE.Mesh(armGeo, skin);
  leftArm.rotation.z = 0.15;
  rightArm.rotation.z = -0.15;
  leftArm.position.set(0, -0.28, 0);
  rightArm.position.set(0, -0.28, 0);
  leftArm.castShadow = true;
  rightArm.castShadow = true;
  armPivotL.add(leftArm);
  armPivotR.add(rightArm);

  const handL = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 10), hoofMat);
  const handR = handL.clone();
  handL.position.set(0, -0.56, 0);
  handR.position.set(0, -0.56, 0);
  leftArm.add(handL);
  rightArm.add(handR);

  const legPivotL = new THREE.Group();
  const legPivotR = new THREE.Group();
  legPivotL.position.set(-0.08, -0.48, -0.16);
  legPivotR.position.set(-0.08, -0.48, 0.16);
  g.add(legPivotL, legPivotR);

  const upperLegGeo = new THREE.CapsuleGeometry(0.1, 0.34, 6, 10);
  const lowerLegGeo = new THREE.CapsuleGeometry(0.085, 0.28, 6, 10);

  const leftLeg = new THREE.Group();
  const rightLeg = new THREE.Group();

  const leftThigh = new THREE.Mesh(upperLegGeo, outfit);
  const rightThigh = new THREE.Mesh(upperLegGeo, outfit);
  leftThigh.position.set(0, -0.18, 0);
  rightThigh.position.set(0, -0.18, 0);
  leftThigh.castShadow = true;
  rightThigh.castShadow = true;
  leftLeg.add(leftThigh);
  rightLeg.add(rightThigh);

  const leftShin = new THREE.Mesh(lowerLegGeo, skin);
  const rightShin = new THREE.Mesh(lowerLegGeo, skin);
  leftShin.position.set(0, -0.46, 0);
  rightShin.position.set(0, -0.46, 0);
  leftShin.castShadow = true;
  rightShin.castShadow = true;
  leftLeg.add(leftShin);
  rightLeg.add(rightShin);

  const leftShoe = new THREE.Group();
  const rightShoe = new THREE.Group();

  const shoeBodyL = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.1, 0.16), shoeMat);
  const shoeBodyR = shoeBodyL.clone();
  shoeBodyL.position.set(0.08, -0.15, 0);
  shoeBodyR.position.set(0.08, -0.15, 0);
  leftShoe.add(shoeBodyL);
  rightShoe.add(shoeBodyR);

  const shoeFrontL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), soleMat);
  const shoeFrontR = shoeFrontL.clone();
  shoeFrontL.scale.set(1.25, 0.65, 0.9);
  shoeFrontR.scale.set(1.25, 0.65, 0.9);
  shoeFrontL.position.set(0.17, -0.13, 0);
  shoeFrontR.position.set(0.17, -0.13, 0);
  leftShoe.add(shoeFrontL);
  rightShoe.add(shoeFrontR);

  leftShoe.position.set(0, -0.68, 0);
  rightShoe.position.set(0, -0.68, 0);

  leftLeg.add(leftShoe);
  rightLeg.add(rightShoe);

  legPivotL.add(leftLeg);
  legPivotR.add(rightLeg);

  const tail = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.025, 8, 18), skin2);
  tail.position.set(-0.73, 0.1, 0);
  tail.rotation.y = Math.PI / 2;
  tail.castShadow = true;
  g.add(tail);

  const label = makeLabel(name);
  label.position.set(0, 1.9, 0);
  g.add(label);

  const myMarker = makeMyMarker();
  g.add(myMarker);

  const pigScale = total > 120 ? 0.34 : total > 90 ? 0.4 : total > 60 ? 0.48 : 0.56;
  const baseY = -1.32 + 1.32 * pigScale;
  g.scale.setScalar(pigScale);
  g.position.set(startX, baseY, laneZ);
  g.rotation.y = 0;
  g.userData = {
    name,index,startX,finishX,laneZ,baseY,
    leftArm: armPivotL,
    rightArm: armPivotR,
    leftLeg: legPivotL,
    rightLeg: legPivotR,
    body,head,label,tail,myMarker,
    chest,belly,
    seed:index*0.73+1.1
  };
  return g;
}

function buildWorld(){
  if(worldGroup) scene.remove(worldGroup);
  worldGroup = new THREE.Group();
  pigs = [];
  finishShown = false;
  $('winnerBanner').style.display = 'none';
  $('winnerBanner').textContent = '';

  const count = state.racers.length;
  const laneGap = count > 150 ? 0.72 : count > 100 ? 0.82 : count > 70 ? 0.95 : count > 40 ? 1.12 : 1.35;
  const startX = -22;
  const finishX = 22;
  const totalDepth = Math.max(22, count * laneGap + 6);

  const grass = new THREE.Mesh(
    new THREE.PlaneGeometry(70, totalDepth + 16),
    new THREE.MeshStandardMaterial({color:0x6fbe5f, roughness:1})
  );
  grass.rotation.x = -Math.PI/2;
  grass.position.y = -1.42;
  grass.receiveShadow = true;
  worldGroup.add(grass);

  const track = new THREE.Mesh(
    new THREE.PlaneGeometry(52, totalDepth),
    new THREE.MeshStandardMaterial({color:0xb87f4f, roughness:0.95})
  );
  track.rotation.x = -Math.PI/2;
  track.position.y = -1.35;
  track.receiveShadow = true;
  worldGroup.add(track);

  for(let i=0;i<count;i++){
    const z = (i - (count - 1)/2) * laneGap;
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(52,0.05),
      new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.35})
    );
    line.rotation.x = -Math.PI/2;
    line.position.set(0,-1.32,z + laneGap/2);
    worldGroup.add(line);
  }

  const startLine = new THREE.Mesh(
    new THREE.BoxGeometry(0.4,0.02,totalDepth),
    new THREE.MeshStandardMaterial({color:0xffffff})
  );
  startLine.position.set(startX - 0.9,-1.24,0);
  worldGroup.add(startLine);

  const finishGroup = new THREE.Group();
  const checkerCols = 2;
  const checkerRows = Math.max(8, Math.ceil(totalDepth / 1.2));
  const tileH = totalDepth / checkerRows;
  for(let r=0;r<checkerRows;r++){
    for(let c=0;c<checkerCols;c++){
      const tile = new THREE.Mesh(
        new THREE.BoxGeometry(0.48,0.05,tileH),
        new THREE.MeshStandardMaterial({color:(r+c)%2===0?0xffffff:0x111111})
      );
      tile.position.set(finishX + c*0.48,-1.2,-totalDepth/2 + tileH/2 + r*tileH);
      finishGroup.add(tile);
    }
  }
  worldGroup.add(finishGroup);

  for(let i=0;i<count;i++){
    const z = (i - (count - 1)/2) * laneGap;
    const pig = createPig(state.racers[i].nickname, i, count, z, startX, finishX);
    pigs.push(pig);
    worldGroup.add(pig);
  }

  const camHeight = Math.max(18, 13 + count * 0.13);
  const camZ = Math.max(18, totalDepth * 0.42);
  camera.position.set(12, camHeight, camZ);
  camera.lookAt(6,0,0);

  scene.add(worldGroup);
  $('sceneInfo').innerHTML = `참가자 ${count}명<br>30초 레이스`;
  renderParticipants();
  refreshMyPigSelection();
  renderTop10();
  renderRanking();
}

function renderParticipants(){
  $('list').innerHTML = state.racers.length
    ? state.racers.map((r,i)=>`<div class="person">${i+1}. ${esc(r.nickname)}</div>`).join('')
    : `<div class="person">아직 참가자가 없습니다.</div>`;
}


function refreshMyPigSelection(){
  let found = false;
  for(const pig of pigs){
    const isMine = !!selectedPigName && pig.userData.name === selectedPigName;
    if(pig.userData.myMarker) pig.userData.myMarker.visible = isMine;
    if(pig.userData.label){
      pig.userData.label.material.opacity = isMine ? 1 : (cameraMode === 'mine' ? 0.45 : 0.9);
    }
    if(isMine) found = true;
  }
  const badge = $('myPigBadge');
  if(cameraMode === 'mine' && selectedPigName && found){
    badge.style.display = 'block';
  }else{
    badge.style.display = 'none';
  }
}

function currentPlaceOf(name){
  const item = state.race?.order?.find(x=>x.nickname===name);
  return item?.place || null;
}

function updateMyPigBadge(){
  const badge = $('myPigBadge');
  if(cameraMode !== 'mine' || !selectedPigName){
    badge.style.display = 'none';
    return;
  }
  const pig = pigs.find(p=>p.userData.name===selectedPigName);
  if(!pig){
    badge.style.display = 'none';
    return;
  }
  const place = currentPlaceOf(selectedPigName);
  badge.style.display = 'block';
  badge.textContent = place ? `⭐ ${selectedPigName} · 현재 ${place}등` : `⭐ ${selectedPigName} · 내 돼지`;
}

function renderTop10(){
  const box = $('top10List');
  if(!state.race?.order?.length){
    box.textContent = '레이스 대기중';
    return;
  }
  box.innerHTML = state.race.order.slice(0,10).map((r,i)=>`
    <div class="top10Row ${r.nickname===selectedPigName?'me':''}">
      <span>${i+1}등</span><span>${esc(r.nickname)}</span>
    </div>
  `).join('');
}

function findMyPig(){
  const q = $('myPigName').value.trim();
  if(!q) return alert('내 닉네임을 입력하세요.');
  const exact = state.racers.find(r=>r.nickname===q);
  const partials = state.racers.filter(r=>r.nickname.toLowerCase().includes(q.toLowerCase()));
  let target = exact;
  if(!target && partials.length===1) target = partials[0];
  if(!target){
    if(partials.length>1) return alert('비슷한 닉네임이 여러 개 있습니다. 정확한 닉네임을 입력하세요.');
    return alert('참가자 명단에서 해당 닉네임을 찾지 못했습니다.');
  }
  selectedPigName = target.nickname;
  cameraMode = 'mine';
  localStorage.setItem('galvent_my_pig', selectedPigName);
  $('myPigName').value = selectedPigName;
  refreshMyPigSelection();
  updateMyPigBadge();
  renderTop10();
}

function showAllPigs(){
  cameraMode = 'all';
  $('myPigBadge').style.display = 'none';
  refreshMyPigSelection();
}

function updateCamera(){
  if(cameraMode !== 'mine' || !selectedPigName) return;
  const pig = pigs.find(p=>p.userData.name===selectedPigName);
  if(!pig) return;

  const pos = new THREE.Vector3();
  pig.getWorldPosition(pos);

  const desired = new THREE.Vector3(pos.x - 7.5, 4.8, pos.z + 7.5);
  camera.position.lerp(desired, 0.08);

  const look = new THREE.Vector3(pos.x + 2.8, 0.15, pos.z);
  camera.lookAt(look);
}

function renderRanking(){
  if(!state.race?.order?.length){
    $('ranking').innerHTML = `<div class="rankRow"><span>순위 없음</span><span>레이스 대기중</span></div>`;
    return;
  }
  $('ranking').innerHTML = state.race.order.map((r,i)=>`
    <div class="rankRow ${i===0?'top1':''}">
      <span>${i+1}위. ${esc(r.nickname)}</span>
      <span>${i===0?'🏆':''}</span>
    </div>
  `).join('');
}

function maybeRebuildWorld(){
  const sig = JSON.stringify({
    racers: state.racers.map(r=>r.nickname),
    startedAt: state.race?.startedAt || 0
  });
  if(sig !== lastSignature){
    lastSignature = sig;
    buildWorld();
  }
}

function updateOverlay(){
  if(!state.race){
    $('timer').textContent = '대기 중';
    return;
  }
  const elapsed = Date.now() - state.race.startedAt;
  const left = Math.max(0, durationMs - elapsed);
  $('timer').textContent = left > 0 ? `⏱ ${(left/1000).toFixed(1)}초` : '🏁 FINISH!';
  if(left <= 0 && state.race.winner && !finishShown){
    finishShown = true;
    $('winnerBanner').style.display = 'block';
    $('winnerBanner').textContent = `🏆 1등 ${state.race.winner} 🐷 춤 타임!`;
  }
}

function animatePig(pig, elapsedSec){
  const data = pig.userData;
  const total = pigs.length || 1;
  const rankMap = new Map((state.race?.order || []).map(x=>[x.nickname,x.place]));
  const place = rankMap.get(data.name) || total;

  let progress = 0;
  if(state.race){
    progress = Math.min(1, Math.max(0, (Date.now() - state.race.startedAt) / durationMs));
  }

  const runSpeed = 12;
  const phase = elapsedSec * runSpeed + data.seed * 3.1;
  let x = data.startX;
  let winnerDance = false;

  if(state.race){
    const finishBias = place === 1 ? 1.02 : 0.9 - ((place-2) / Math.max(1,total-1)) * 0.24;
    const wobble = Math.sin(elapsedSec * 3.8 + data.seed * 5) * (1-progress) * 0.55;
    const pct = progress < 1
      ? Math.max(0, Math.min(1, progress * finishBias + wobble * 0.02))
      : (place === 1 ? 1.03 : Math.max(0.82, 0.98 - place * 0.0026));

    x = THREE.MathUtils.lerp(data.startX, data.finishX, pct);

    if(progress >= 1 && place === 1){
      winnerDance = true;
      x = data.finishX + 0.8;
    }
  }

  pig.position.x = x;
  pig.position.z = data.laneZ;

  if(winnerDance){
    pig.position.y = Math.abs(Math.sin(elapsedSec * 7)) * 0.45;
    pig.rotation.y = -Math.PI/2 + Math.sin(elapsedSec * 8) * 0.6;
    pig.rotation.z = Math.sin(elapsedSec * 10) * 0.06;
    data.leftArm.rotation.z = Math.sin(elapsedSec * 12) * 1.2 + 0.7;
    data.rightArm.rotation.z = -Math.sin(elapsedSec * 12) * 1.2 - 0.7;
    data.leftLeg.rotation.z = Math.sin(elapsedSec * 10) * 0.35;
    data.rightLeg.rotation.z = -Math.sin(elapsedSec * 10) * 0.35;
    data.body.rotation.z = Math.sin(elapsedSec * 12) * 0.08;
    data.head.rotation.z = -Math.sin(elapsedSec * 12) * 0.07;
  }else{
     }else{
    const moving = state.race ? 1 : 0.35;
    pig.position.y = data.baseY + Math.abs(Math.sin(phase)) * 0.04 * moving;
    pig.rotation.y = 0;
    pig.rotation.z = -0.12;

    data.leftLeg.rotation.z = Math.sin(phase) * 1.05 * moving;
    data.rightLeg.rotation.z = -Math.sin(phase) * 1.05 * moving;

    data.leftArm.rotation.z = -Math.sin(phase) * 0.95 * moving - 0.25;
    data.rightArm.rotation.z = Math.sin(phase) * 0.95 * moving + 0.25;

    data.body.rotation.z = -0.16 + Math.sin(phase * 2) * 0.03 * moving;
    data.body.rotation.x = Math.cos(phase * 2) * 0.02 * moving;
    data.head.rotation.z = 0.08 + Math.sin(phase * 1.6) * 0.04 * moving;
    data.head.rotation.x = -0.08;
  }

  data.tail.rotation.x = elapsedSec * 8 + data.seed;
  data.label.position.x = 0;
  data.label.position.y = 1.85;
}


function updateAllCamera(){
  if(cameraMode !== 'all') return;
  const count = state.racers.length;
  const laneGap = count > 150 ? 0.72 : count > 100 ? 0.82 : count > 70 ? 0.95 : count > 40 ? 1.12 : 1.35;
  const totalDepth = Math.max(22, count * laneGap + 6);
  const camHeight = Math.max(18, 13 + count * 0.13);
  const camZ = Math.max(18, totalDepth * 0.42);
  const desired = new THREE.Vector3(12,camHeight,camZ);
  camera.position.lerp(desired,0.06);
  camera.lookAt(6,0,0);
}

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  updateOverlay();
  pigs.forEach(p => animatePig(p, t));
  updateCamera();
  updateAllCamera();
  updateMyPigBadge();
  renderTop10();
  renderer.render(scene, camera);
}

async function poll(){
  try{
    state = await api('/api/state');
    maybeRebuildWorld();
    updateOverlay();
    setStatus(`참가자 ${state.racers.length} / 200명`);
    if(!state.race){
      setSub('댓글을 불러온 뒤 레이스를 시작할 수 있습니다.');
    }else{
      const elapsed = Date.now() - state.race.startedAt;
      if(elapsed < durationMs){
        setSub('레이스 진행 중...');
      }else{
        setSub(`레이스 종료 · 1등 ${state.race.winner}`);
      }
    }
  }catch(e){
    setSub('서버 연결을 확인하세요.');
  }
}

async function loadComments(){
  const key = $('key').value.trim();
  const url = $('post').value.trim();
  if(!key) return alert('ADMIN_KEY를 입력하세요.');
  if(!url) return alert('디시 게시글 주소를 입력하세요.');
  setSub('댓글 참가자 불러오는 중...');
  try{
    const d = await api('/api/admin/import',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + key},
      body:JSON.stringify({url})
    });
    await poll();
    alert(`댓글 ${d.commentCount ?? '-'}개 / 참가자 ${d.count}명 불러왔습니다.`);
    setSub(`댓글 ${d.commentCount ?? '-'}개 → 참가자 ${d.count}명`);
  }catch(e){
    alert(e.message);
    setSub(e.message);
  }
}

async function startRace(){
  const key = $('key').value.trim();
  if(!key) return alert('ADMIN_KEY를 입력하세요.');
  if(!state.racers.length) return alert('먼저 댓글을 불러오세요.');
  if(!confirm(`${state.racers.length}명으로 30초 레이스를 시작할까요?`)) return;
  try{
    await api('/api/admin/start',{
      method:'POST',
      headers:{'Authorization':'Bearer ' + key}
    });
    finishShown = false;
    $('winnerBanner').style.display = 'none';
    await poll();

    if(musicEnabled){
      try{
        bgm.currentTime = 0;
        await bgm.play();
      }catch(e){
        console.log('음악 자동재생 차단 또는 파일 없음');
      }
    }
  }catch(e){
    alert(e.message);
  }
}

async function resetRace(){
  const key = $('key').value.trim();
  if(!key) return alert('ADMIN_KEY를 입력하세요.');
  if(!confirm('참가자와 레이스를 전부 초기화할까요?')) return;
  try{
    await api('/api/admin/reset',{
      method:'POST',
      headers:{'Authorization':'Bearer ' + key}
    });
    bgm.pause();
    bgm.currentTime = 0;
    finishShown = false;
    state = {racers:[],race:null};
    lastSignature = '';
    await poll();
  }catch(e){
    alert(e.message);
  }
}

function toggleMusic(){
  musicEnabled = !musicEnabled;
  $('musicBtn').textContent = musicEnabled ? '🎵 음악 ON' : '🔇 음악 OFF';
  if(!musicEnabled){
    bgm.pause();
  }else if(state.race && (Date.now() - state.race.startedAt) < durationMs){
    bgm.play().catch(()=>{});
  }
}

window.loadComments = loadComments;
window.startRace = startRace;
window.resetRace = resetRace;
window.toggleMusic = toggleMusic;
window.findMyPig = findMyPig;
window.showAllPigs = showAllPigs;

initScene();
if(selectedPigName) $('myPigName').value = selectedPigName;
poll();
setInterval(poll, 1500);
</script>
</body>
