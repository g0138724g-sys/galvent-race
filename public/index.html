<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>갤벤 레이스</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#9de5ff,#e8f9ff 45%,#83d77c 45%,#359b55);font-family:system-ui,'Malgun Gothic',sans-serif;color:#26344a;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:24px 14px}h1{text-align:center;font-size:clamp(34px,7vw,60px);margin:8px;color:#fff;text-shadow:0 4px 0 #4b7a9d,0 7px 15px #4568}p{text-align:center}.panel{background:#ffffffed;border:3px solid white;border-radius:22px;padding:18px;margin:16px 0;box-shadow:0 8px 20px #17452c33}.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}input,button{font:inherit;border-radius:12px;padding:12px 15px;border:2px solid #b8d4e4}button{cursor:pointer;font-weight:800;background:#ffca57;color:#553b16;border-color:#ffe69c}button:disabled{opacity:.5;cursor:not-allowed}.track{background:repeating-linear-gradient(0deg,#fff 0 3px,#f5f7f7 3px 58px);border:5px solid #fff;border-radius:16px;overflow:hidden;padding:10px;position:relative}.lane{height:58px;border-bottom:2px dashed #d0d8df;position:relative;display:flex;align-items:center}.lane:last-child{border:0}.pig{position:absolute;left:0;transform:translateX(0);font-size:35px;transition:left .25s linear;filter:drop-shadow(0 3px 1px #0003);z-index:2}.name{position:absolute;left:48px;font-size:12px;font-weight:800;white-space:nowrap;z-index:3;background:#ffffffbb;border-radius:5px;padding:2px 4px}.finish{position:absolute;right:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(0deg,#222 0 8px,#fff 8px 16px);z-index:1}.small{font-size:13px;color:#52677b}.status{text-align:center;font-size:19px;font-weight:900}.leader{font-weight:800;line-height:1.8}.hide{display:none}ol{padding-left:25px}footer{text-align:center;color:#fff;font-size:12px;padding:12px}@media(max-width:600px){.name{font-size:10px;left:42px}.pig{font-size:29px}.lane{height:48px}}</style></head><body><div class="wrap"><h1>🏁 갤벤 레이스 🐷</h1><p>참가 등록하고 돼지들의 25초 레이스를 구경하세요!</p><section class="panel"><div class="row"><input id="nick" maxlength="20" placeholder="디시 닉네임"><button id="join">🐷 참가 등록</button></div><p id="msg" class="status">참가자를 기다리는 중!</p><p id="count">참가자 0 / 200명</p><p class="small">등록한 닉네임은 중복으로 사용할 수 없습니다. 레이스 시작 후에는 참가할 수 없습니다.</p></section><section class="panel"><h2>🐖 레이스 트랙</h2><div id="track" class="track"><p>참가자가 등록되면 돼지들이 출발선에 모입니다!</p></div><p id="timer" class="status">출발 대기</p><p id="winner" class="status"></p></section><section class="panel"><h2>🏆 참가자 목록 / 결과</h2><div id="list" class="leader">아직 참가자가 없습니다.</div></
