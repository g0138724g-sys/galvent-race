<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>갤벤 레이스</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,"Noto Sans KR",sans-serif;
      background:linear-gradient(180deg,#89d7ff 0%,#c8f0ff 35%,#7cc46a 35%,#5aa14a 100%);
      color:#1f2430;
    }
    .wrap{max-width:1400px;margin:auto;padding:18px}
    .title{font-size:40px;font-weight:900;text-align:center;margin:4px 0 8px}
    .sub{text-align:center;margin-bottom:14px;color:#234}
    .panel{
      background:#ffffffee;
      border-radius:22px;
      padding:16px;
      margin-bottom:14px;
      box-shadow:0 8px 22px #0002;
      border:2px solid #ffffff;
    }
    .controls{
      display:grid;
      grid-template-columns:1fr 2fr repeat(4,auto);
      gap:8px;

      font:inherit;

    }
    input{background:#fff}
    button{
      border:0;
      font-weight:900;
      cursor:pointer;
    }
    .btn-load{background:#ffd65b}
    .btn-start{background:#ff8c8c}
    .btn-reset{background:#ddd}
    .btn-music{background:#b7d7ff}
    .status{margin-top:10px;text-align:center;font-weight:900}
    .substatus{margin-top:6px;text-align:center;font-size:13px;color:#5a6475}
    .scenePanel{padding:10px}
    #sceneWrap{
      position:relative;
      width:100%;
      height:72vh;
      min-height:520px;
      border-radius:20px;
      overflow:hidden;
      background:linear-gradient(180deg,#8fd9ff 0%,#daf7ff 40%,#88cf74 40%,#64ad52 100%);

    #scene{width:100%;height:100%;display:block}

      font-size:12px;line-height:1.15;font-weight:900;color:#171717;

    }
    .pigNameTag.mine{

    }
    .overlay{

    .infoBadge{
      position:absolute;top:14px;right:14px;

      border-radius:14px;
      padding:10px 14px;

      font-weight:800;

      text-align:right;

    }
    .winnerBanner{

      left:50%;bottom:18px;transform:translateX(-50%);

    </div>
    <div class="status" id="status">참가자 0 / 200명</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
  }

</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';

const $ = id => document.getElementById(id);

let state = { racers: [], race: null };
let scene, camera, renderer, clock;
let pigs = [];
let worldGroup = null;
let lastSignature = '';
let musicEnabled = true;
let finishShown = false;
let selectedPigName = localStorage.getItem('galvent_my_pig') || '';
let cameraMode = selectedPigName ? 'mine' : 'all';
let pigTemplate = null;
let pigModelReady = false;
let pigModelError = '';
const pigModelUrls = ['/piggu.glb','/piggu_test.glb','/piggu_web.glb'];
const _axisX = new THREE.Vector3(1,0,0);
const _axisZ = new THREE.Vector3(0,0,1);
const _tmpQ = new THREE.Quaternion();
const _tmpV = new THREE.Vector3();
const durationMs = 30000;
const bgm = new Audio('/race.mp3');
bgm.loop = true;
bgm.volume = 0.55;

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(url,opt={}){
  const r = await fetch(url,opt);
  const d = await r.json().catch(()=>({error:'서버 응답 오류'}));
  if(!r.ok) throw Error(d.error || '오류가 발생했습니다.');
  return d;
}

function setStatus(t){ $('status').textContent = t; }
function setSub(t){ $('substatus').textContent = t; }

function initScene(){
  const canvas = $('scene');
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize($('sceneWrap').clientWidth, $('sceneWrap').clientHeight, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xdff6ff, 40, 140);

  camera = new THREE.PerspectiveCamera(
    42,
    $('sceneWrap').clientWidth / $('sceneWrap').clientHeight,
    0.1,
    400
  );
  camera.position.set(15, 28, 34);
  camera.lookAt(6, 0, 0);

  clock = new THREE.Clock();

  const hemi = new THREE.HemisphereLight(0xffffff, 0x6dbd66, 1.2);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 1.25);
  dir.position.set(15, 30, 16);
  dir.castShadow = true;
  dir.shadow.mapSize.set(2048,2048);
  dir.shadow.camera.left = -80;
  dir.shadow.camera.right = 80;
  dir.shadow.camera.top = 80;
  dir.shadow.camera.bottom = -80;
  scene.add(dir);

  window.addEventListener('resize', onResize);
  animate();
}

function onResize(){
  const w = $('sceneWrap').clientWidth;
  const h = $('sceneWrap').clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function makeLabel(text){
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 128;
  const ctx = c.getContext('2d');

  ctx.fillStyle = 'rgba(255,255,255,0.96)';
  roundRect(ctx, 0, 18, 512, 84, 24);
  ctx.fill();

  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 3;
  roundRect(ctx, 1.5, 19.5, 509, 81, 22);
  ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.font = 'bold 42px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const clipped = text.length > 14 ? text.slice(0,14) + '…' : text;
  ctx.fillText(clipped, 256, 60);

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4.8, 1.2, 1);
  return sprite;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}


function makeMyMarker(){
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 160;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(255,236,246,0.98)';
  roundRect(ctx, 12, 22, 488, 110, 34);
  ctx.fill();
  ctx.strokeStyle = '#ff5fa3';
  ctx.lineWidth = 8;
  roundRect(ctx, 12, 22, 488, 110, 34);
  ctx.stroke();
  ctx.fillStyle = '#ff297f';
  ctx.font = '900 45px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⭐ 내 돼지', 256, 77);
  const tex = new THREE.CanvasTexture(c);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sprite.scale.set(4.8,1.5,1);
  sprite.position.set(0,3.2,0);
  sprite.visible = false;
  return sprite;
}

function findBone(root, candidates){
  for(const n of candidates){
    const exact = root.getObjectByName(n);
    if(exact && exact.isBone) return exact;
  }
  const wanted = candidates.map(x=>x.toLowerCase());
  let found = null;
  root.traverse(o=>{
    if(found || !o.isBone) return;
    const n = String(o.name || '').toLowerCase();
    if(wanted.includes(n)) found = o;
  });
  return found;
}

function captureRig(model){
  const bones = {
    armL: findBone(model,['arm.l','c_arm_fk.l']),
    armR: findBone(model,['arm.r','c_arm_fk.r']),
    forearmL: findBone(model,['forearm.l','c_forearm_fk.l']),
    forearmR: findBone(model,['forearm.r','c_forearm_fk.r']),
    thighL: findBone(model,['thigh.l','c_thigh_fk.l']),
    thighR: findBone(model,['thigh.r','c_thigh_fk.r']),
    legL: findBone(model,['leg.l','c_leg_fk.l']),
    legR: findBone(model,['leg.r','c_leg_fk.r']),
    footL: findBone(model,['foot.l','c_foot_fk.l']),
    footR: findBone(model,['foot.r','c_foot_fk.r']),
    spine: findBone(model,['_spine_01.x','spine_01.x','spine.x','c_spine_01.x']),
    neck: findBone(model,['neck.x','c_neck.x']),
    head: findBone(model,['head.x','c_head.x'])
  };
  const rest = {};
  for(const [k,b] of Object.entries(bones)){
    if(b) rest[k] = b.quaternion.clone();
  }
  return {bones,rest};
}

function setBoneDelta(rig,key,axis,angle){
  const b = rig.bones[key];
  const q0 = rig.rest[key];
  if(!b || !q0) return;
  _tmpQ.setFromAxisAngle(axis,angle);
  b.quaternion.copy(q0).multiply(_tmpQ);
}

function makeNameTag(name){
  const el = document.createElement('div');
  el.className = 'pigNameTag';
  el.textContent = name;
  $('nameLayer').appendChild(el);
  return el;
}


function isRigHelper(o){
  const n = String(o.name || '').toLowerCase();
  return n.startsWith('wgt-') || n.startsWith('wgt_') ||
         n.includes('custom_shape') || n.includes('widget') ||
         n.includes('rig_ui') || n.includes('metarig');
}

function characterBounds(model){
  const skinnedBox = new THREE.Box3();
  let skinnedCount = 0;
  model.updateMatrixWorld(true);
  model.traverse(o=>{
    if(o.isSkinnedMesh && !isRigHelper(o)){
      skinnedBox.expandByObject(o, true);
      skinnedCount++;
    }
  });
  if(skinnedCount && !skinnedBox.isEmpty()) return skinnedBox;

  const meshBox = new THREE.Box3();
  model.traverse(o=>{
    if(o.isMesh && !isRigHelper(o) && o.visible !== false){
      meshBox.expandByObject(o, true);
    }
  });
  return meshBox;
}

function createPig(name, index, total, laneZ, startX, finishX){
  const g = new THREE.Group();
  const model = cloneSkeleton(pigTemplate);

  model.traverse(o=>{
    // Rigify/Blender 보조 도형은 캐릭터 크기 계산과 화면 표시에서 제외
    if(isRigHelper(o)){
      o.visible = false;
      return;
    }
    if(o.isMesh){
      o.visible = true;
      o.castShadow = true;
      o.receiveShadow = true;
      o.frustumCulled = false;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.filter(Boolean).forEach(m=>{
        m.visible = true;
        m.side = THREE.DoubleSide;
        if('opacity' in m && m.opacity <= 0.02) m.opacity = 1;
      });
    }
  });

  // 전체 rig가 아니라 실제 캐릭터 mesh만 기준으로 크기를 잡는다.
  let box = characterBounds(model);
  const size = new THREE.Vector3();
  box.getSize(size);
  const targetHeight = 3.6;
  const modelScale = targetHeight / Math.max(0.001,size.y);
  model.scale.setScalar(modelScale);
  model.updateMatrixWorld(true);

  box = characterBounds(model);
  const center = new THREE.Vector3();
  box.getCenter(center);
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= box.min.y;

  // Blender glTF의 Y-up 기준. +X 방향으로 달리도록 회전.
  model.rotation.y = Math.PI / 2;

  const crowdScale = total > 150 ? 0.58 : total > 100 ? 0.68 : total > 70 ? 0.78 : total > 40 ? 0.86 : 0.94;
  g.scale.setScalar(crowdScale);
  g.add(model);

  const labelEl = makeNameTag(name);
  const baseY = -1.27;
  g.position.set(startX,baseY,laneZ);

  const rig = captureRig(model);

  g.userData = {
    name,index,startX,finishX,laneZ,baseY,
    model,rig,labelEl,
    seed:index*0.73+1.1,
    displayHeight:targetHeight*crowdScale
  };
  return g;
}

async function loadPigModel(){
  const loader = new GLTFLoader();
  let lastErr = null;

  for(const url of pigModelUrls){
    try{
      const gltf = await loader.loadAsync(url);
      pigTemplate = gltf.scene;
      pigTemplate.updateMatrixWorld(true);
      pigModelReady = true;
      pigModelError = '';
      setSub('3D 돼지 모델 준비 완료');
      lastSignature = '';
      maybeRebuildWorld();
      return;
    }catch(e){
      lastErr = e;
    }
  }

  pigModelError = 'piggu.glb를 불러오지 못했습니다.';
  console.error(lastErr);
  setSub('3D 돼지 모델 파일 확인 필요: public/piggu.glb');
}

function clearNameLabels(){
  const layer = $('nameLayer');
  while(layer.firstChild) layer.removeChild(layer.firstChild);
}

function buildWorld(){
  if(worldGroup) scene.remove(worldGroup);
  clearNameLabels();

  if(!pigModelReady || !pigTemplate){
    worldGroup = null;
    $('sceneInfo').innerHTML = pigModelError ? '3D 모델 오류' : '🐷 3D 돼지 로딩중...';
    return;
  }

  worldGroup = new THREE.Group();
  pigs = [];
  finishShown = false;
  $('winnerBanner').style.display = 'none';
  $('winnerBanner').textContent = '';

  const count = state.racers.length;
  const laneGap = count > 150 ? 0.72 : count > 100 ? 0.82 : count > 70 ? 0.95 : count > 40 ? 1.12 : 1.35;
  const startX = -22;
  const finishX = 22;
  const totalDepth = Math.max(22, count * laneGap + 6);

  const grass = new THREE.Mesh(
    new THREE.PlaneGeometry(70, totalDepth + 16),
    new THREE.MeshStandardMaterial({color:0x6fbe5f, roughness:1})
  );
  grass.rotation.x = -Math.PI/2;
  grass.position.y = -1.42;
  grass.receiveShadow = true;
  worldGroup.add(grass);

  const track = new THREE.Mesh(
    new THREE.PlaneGeometry(52, totalDepth),
    new THREE.MeshStandardMaterial({color:0xb87f4f, roughness:0.95})
  );
  track.rotation.x = -Math.PI/2;
  track.position.y = -1.35;
  track.receiveShadow = true;
  worldGroup.add(track);

  for(let i=0;i<count;i++){
    const z = (i - (count - 1)/2) * laneGap;
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(52,0.05),
      new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.35})
    );
    line.rotation.x = -Math.PI/2;
    line.position.set(0,-1.32,z + laneGap/2);
    worldGroup.add(line);
  }

  const startLine = new THREE.Mesh(
    new THREE.BoxGeometry(0.4,0.02,totalDepth),
    new THREE.MeshStandardMaterial({color:0xffffff})
  );
  startLine.position.set(startX - 0.9,-1.24,0);
  worldGroup.add(startLine);

  const finishGroup = new THREE.Group();
  const checkerCols = 2;
  const checkerRows = Math.max(8, Math.ceil(totalDepth / 1.2));
  const tileH = totalDepth / checkerRows;
  for(let r=0;r<checkerRows;r++){
    for(let c=0;c<checkerCols;c++){
      const tile = new THREE.Mesh(
        new THREE.BoxGeometry(0.48,0.05,tileH),
        new THREE.MeshStandardMaterial({color:(r+c)%2===0?0xffffff:0x111111})
      );
      tile.position.set(finishX + c*0.48,-1.2,-totalDepth/2 + tileH/2 + r*tileH);
      finishGroup.add(tile);
    }
  }
  worldGroup.add(finishGroup);

  for(let i=0;i<count;i++){
    const z = (i - (count - 1)/2) * laneGap;
    const pig = createPig(state.racers[i].nickname, i, count, z, startX, finishX);
    pigs.push(pig);
    worldGroup.add(pig);
  }

  const camHeight = Math.max(18, 13 + count * 0.13);
  const camZ = Math.max(18, totalDepth * 0.42);
  camera.position.set(12, camHeight, camZ);
  camera.lookAt(6,0,0);

  scene.add(worldGroup);
  $('sceneInfo').innerHTML = `참가자 ${count}명<br>30초 레이스`;
  renderParticipants();
  refreshMyPigSelection();
  renderTop10();
  renderRanking();
}

function renderParticipants(){
  $('list').innerHTML = state.racers.length
    ? state.racers.map((r,i)=>`<div class="person">${i+1}. ${esc(r.nickname)}</div>`).join('')
    : `<div class="person">아직 참가자가 없습니다.</div>`;
}


function refreshMyPigSelection(){
  let found = false;
  for(const pig of pigs){
    const isMine = !!selectedPigName && pig.userData.name === selectedPigName;
    if(pig.userData.myMarker) pig.userData.myMarker.visible = isMine;
    if(pig.userData.label){
      pig.userData.label.material.opacity = isMine ? 1 : (cameraMode === 'mine' ? 0.45 : 0.9);
    }
    if(isMine) found = true;
  }
  const badge = $('myPigBadge');
  if(cameraMode === 'mine' && selectedPigName && found){
    badge.style.display = 'block';
  }else{
    badge.style.display = 'none';
  }
}

function currentPlaceOf(name){
  const item = state.race?.order?.find(x=>x.nickname===name);
  return item?.place || null;
}

function updateMyPigBadge(){
  const badge = $('myPigBadge');
  if(cameraMode !== 'mine' || !selectedPigName){
    badge.style.display = 'none';
    return;
  }
  const pig = pigs.find(p=>p.userData.name===selectedPigName);
  if(!pig){
    badge.style.display = 'none';
    return;
  }
  const place = currentPlaceOf(selectedPigName);
  badge.style.display = 'block';
  badge.textContent = place ? `⭐ ${selectedPigName} · 현재 ${place}등` : `⭐ ${selectedPigName} · 내 돼지`;
}

function renderTop10(){
  const box = $('top10List');
  if(!state.race?.order?.length){
    box.textContent = '레이스 대기중';
    return;
  }
  box.innerHTML = state.race.order.slice(0,10).map((r,i)=>`
    <div class="top10Row ${r.nickname===selectedPigName?'me':''}">
      <span>${i+1}등</span><span>${esc(r.nickname)}</span>
    </div>
  `).join('');
}

function findMyPig(){
  const q = $('myPigName').value.trim();
  if(!q) return alert('내 닉네임을 입력하세요.');
  const exact = state.racers.find(r=>r.nickname===q);
  const partials = state.racers.filter(r=>r.nickname.toLowerCase().includes(q.toLowerCase()));
  let target = exact;
  if(!target && partials.length===1) target = partials[0];
  if(!target){
    if(partials.length>1) return alert('비슷한 닉네임이 여러 개 있습니다. 정확한 닉네임을 입력하세요.');
    return alert('참가자 명단에서 해당 닉네임을 찾지 못했습니다.');
  }
  selectedPigName = target.nickname;
  cameraMode = 'mine';
  localStorage.setItem('galvent_my_pig', selectedPigName);
  $('myPigName').value = selectedPigName;
  refreshMyPigSelection();
  updateMyPigBadge();
  renderTop10();
}

function showAllPigs(){
  cameraMode = 'all';
  $('myPigBadge').style.display = 'none';
  refreshMyPigSelection();
}

function updateCamera(){
  if(cameraMode !== 'mine' || !selectedPigName) return;
  const pig = pigs.find(p=>p.userData.name===selectedPigName);
  if(!pig) return;

  const pos = new THREE.Vector3();
  pig.getWorldPosition(pos);

  const desired = new THREE.Vector3(pos.x - 1.8, pos.y + 2.6, pos.z + 6.4);
  camera.position.lerp(desired, 0.08);

  const look = new THREE.Vector3(pos.x + 1.5, pos.y + 0.7, pos.z);
  camera.lookAt(look);
}

function renderRanking(){
  if(!state.race?.order?.length){
    $('ranking').innerHTML = `<div class="rankRow"><span>순위 없음</span><span>레이스 대기중</span></div>`;
    return;
  }
  $('ranking').innerHTML = state.race.order.map((r,i)=>`
    <div class="rankRow ${i===0?'top1':''}">
      <span>${i+1}위. ${esc(r.nickname)}</span>
      <span>${i===0?'🏆':''}</span>
    </div>
  `).join('');
}

function maybeRebuildWorld(){
  const sig = JSON.stringify({
    racers: state.racers.map(r=>r.nickname),
    startedAt: state.race?.startedAt || 0
  });
  if(sig !== lastSignature){
    lastSignature = sig;
    buildWorld();
  }
}

function updateOverlay(){
  if(!state.race){
    $('timer').textContent = '대기 중';
    return;
  }
  const elapsed = Date.now() - state.race.startedAt;
  const left = Math.max(0, durationMs - elapsed);
  $('timer').textContent = left > 0 ? `⏱ ${(left/1000).toFixed(1)}초` : '🏁 FINISH!';
  if(left <= 0 && state.race.winner && !finishShown){
    finishShown = true;
    $('winnerBanner').style.display = 'block';
    $('winnerBanner').textContent = `🏆 1등 ${state.race.winner} 🐷 춤 타임!`;
  }
}

function animatePig(pig, elapsedSec){
  const data = pig.userData;
  const rig = data.rig;
  const total = pigs.length || 1;
  const rankMap = new Map((state.race?.order || []).map(x=>[x.nickname,x.place]));
  const place = rankMap.get(data.name) || total;

  let progress = 0;
  if(state.race){
    progress = Math.min(1,Math.max(0,(Date.now()-state.race.startedAt)/durationMs));
  }

  const runSpeed = 12.5;
  const phase = elapsedSec*runSpeed + data.seed*3.1;
  let x = data.startX;
  let winnerDance = false;

  if(state.race){
    const finishBias = place===1 ? 1.02 : 0.9-((place-2)/Math.max(1,total-1))*0.24;
    const wobble = Math.sin(elapsedSec*3.8+data.seed*5)*(1-progress)*0.55;
    const pct = progress<1
      ? Math.max(0,Math.min(1,progress*finishBias+wobble*0.02))
      : (place===1 ? 1.03 : Math.max(0.82,0.98-place*0.0026));
    x = THREE.MathUtils.lerp(data.startX,data.finishX,pct);
    if(progress>=1 && place===1){
      winnerDance = true;
      x = data.finishX+0.8;
    }
  }

  pig.position.x = x;
  pig.position.z = data.laneZ;

  if(winnerDance){
    pig.position.y = data.baseY + Math.abs(Math.sin(elapsedSec*6.5))*0.22;
    pig.rotation.y = Math.sin(elapsedSec*5)*0.45;
    pig.rotation.z = Math.sin(elapsedSec*8)*0.05;

    setBoneDelta(rig,'armL',_axisX,1.25+Math.sin(elapsedSec*8)*0.55);
    setBoneDelta(rig,'armR',_axisX,-1.25-Math.sin(elapsedSec*8)*0.55);
    setBoneDelta(rig,'forearmL',_axisX,-0.8);
    setBoneDelta(rig,'forearmR',_axisX,-0.8);
    setBoneDelta(rig,'thighL',_axisX,Math.sin(elapsedSec*7)*0.45);
    setBoneDelta(rig,'thighR',_axisX,-Math.sin(elapsedSec*7)*0.45);
    setBoneDelta(rig,'spine',_axisZ,Math.sin(elapsedSec*6)*0.10);
    setBoneDelta(rig,'head',_axisZ,-Math.sin(elapsedSec*6)*0.08);
  }else{
    const moving = state.race ? 1 : 0.22;
    const stride = Math.sin(phase);
    const stride2 = Math.sin(phase+Math.PI);

    pig.position.y = data.baseY + Math.max(0,Math.sin(phase*2))*0.035*moving;
    pig.rotation.y = 0;
    pig.rotation.z = -0.025;

    // 사람 달리기처럼 반대쪽 팔/다리를 교차시킴
    setBoneDelta(rig,'thighL',_axisX,stride*0.82*moving);
    setBoneDelta(rig,'thighR',_axisX,stride2*0.82*moving);
    setBoneDelta(rig,'legL',_axisX,-Math.max(0,-stride)*0.95*moving);
    setBoneDelta(rig,'legR',_axisX,-Math.max(0,-stride2)*0.95*moving);
    setBoneDelta(rig,'footL',_axisX,Math.max(0,stride)*0.28*moving);
    setBoneDelta(rig,'footR',_axisX,Math.max(0,stride2)*0.28*moving);

    setBoneDelta(rig,'armL',_axisX,-stride*0.88*moving);
    setBoneDelta(rig,'armR',_axisX,-stride2*0.88*moving);
    setBoneDelta(rig,'forearmL',_axisX,-0.62-Math.max(0,stride)*0.18*moving);
    setBoneDelta(rig,'forearmR',_axisX,-0.62-Math.max(0,stride2)*0.18*moving);

    setBoneDelta(rig,'spine',_axisZ,-0.10*moving+Math.sin(phase*2)*0.018*moving);
    setBoneDelta(rig,'neck',_axisZ,0.04*moving);
    setBoneDelta(rig,'head',_axisZ,0.05*moving);
  }
}

function updateNameLabels(){
  if(!camera || !renderer) return;
  const wrap = $('sceneWrap');
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  const order = state.race?.order || [];
  const placeMap = new Map(order.map(x=>[x.nickname,x.place]));

  for(const pig of pigs){
    const d = pig.userData;
    const el = d.labelEl;
    if(!el) continue;

    pig.getWorldPosition(_tmpV);
    _tmpV.y += Math.max(1.0,d.displayHeight+0.25);
    _tmpV.project(camera);

    const onScreen =
      _tmpV.z>-1 && _tmpV.z<1 &&
      _tmpV.x>-1.08 && _tmpV.x<1.08 &&
      _tmpV.y>-1.10 && _tmpV.y<1.10;

    if(!onScreen){
      el.style.display = 'none';
      continue;
    }

    const x = (_tmpV.x*0.5+0.5)*w;
    const y = (-_tmpV.y*0.5+0.5)*h;
    el.style.display = 'block';
    el.style.transform = `translate(-50%,-100%) translate(${x}px,${y}px)`;

    const place = placeMap.get(d.name);
    el.className = 'pigNameTag' +
      (place && place<=10 ? ' top10' : '') +
      (d.name===selectedPigName ? ' mine' : '');

    if(d.name===selectedPigName){
      el.textContent = `⭐ ${place ? place+'등 · ' : ''}${d.name}`;
    }else if(place && place<=10){
      el.textContent = `${place}등 · ${d.name}`;
    }else{
      el.textContent = d.name;
    }
  }
}

function updateAllCamera(){
  if(cameraMode !== 'all') return;
  const count = state.racers.length;
  const laneGap = count > 150 ? 0.72 : count > 100 ? 0.82 : count > 70 ? 0.95 : count > 40 ? 1.12 : 1.35;
  const totalDepth = Math.max(22, count * laneGap + 6);

  let focusX = -18;
  if(pigs.length){
    focusX = pigs.reduce((a,p)=>a+p.position.x,0) / pigs.length;
  }

  // 참가자가 많아도 시작선/달리는 무리가 화면 한가운데 오게 따라간다.
  const camHeight = Math.max(17, 11 + count * 0.105);
  const camZ = Math.max(18, totalDepth * 0.38);
  const desired = new THREE.Vector3(focusX + 8, camHeight, camZ);
  camera.position.lerp(desired,0.07);
  camera.lookAt(focusX + 1.5,0.25,0);
}

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  updateOverlay();
  pigs.forEach(p => animatePig(p, t));
  updateCamera();
  updateAllCamera();
  updateMyPigBadge();
  renderTop10();
  updateNameLabels();
  renderer.render(scene, camera);
}

async function poll(){
  try{
    state = await api('/api/state');
    maybeRebuildWorld();
    updateOverlay();
    setStatus(`참가자 ${state.racers.length} / 200명`);
    if(!state.race){
      setSub('댓글을 불러온 뒤 레이스를 시작할 수 있습니다.');
    }else{
      const elapsed = Date.now() - state.race.startedAt;
      if(elapsed < durationMs){
        setSub('레이스 진행 중...');
      }else{
        setSub(`레이스 종료 · 1등 ${state.race.winner}`);
      }
    }
  }catch(e){
    setSub('서버 연결을 확인하세요.');
  }
}

async function loadComments(){
  const key = $('key').value.trim();
  const url = $('post').value.trim();
  if(!key) return alert('ADMIN_KEY를 입력하세요.');
  if(!url) return alert('디시 게시글 주소를 입력하세요.');
  setSub('댓글 참가자 불러오는 중...');
  try{
    const d = await api('/api/admin/import',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + key},
      body:JSON.stringify({url})
    });
    await poll();
    alert(`댓글 ${d.commentCount ?? '-'}개 / 참가자 ${d.count}명 불러왔습니다.`);
    setSub(`댓글 ${d.commentCount ?? '-'}개 → 참가자 ${d.count}명`);
  }catch(e){
    alert(e.message);
    setSub(e.message);
  }
}

async function startRace(){
  const key = $('key').value.trim();
  if(!key) return alert('ADMIN_KEY를 입력하세요.');
  if(!state.racers.length) return alert('먼저 댓글을 불러오세요.');
  if(!confirm(`${state.racers.length}명으로 30초 레이스를 시작할까요?`)) return;
  try{
    await api('/api/admin/start',{
      method:'POST',
      headers:{'Authorization':'Bearer ' + key}
    });
    finishShown = false;
    $('winnerBanner').style.display = 'none';
    await poll();

    if(musicEnabled){
      try{
        bgm.currentTime = 0;
        await bgm.play();
      }catch(e){
        console.log('음악 자동재생 차단 또는 파일 없음');
      }
    }
  }catch(e){
    alert(e.message);
  }
}

async function resetRace(){
  const key = $('key').value.trim();
  if(!key) return alert('ADMIN_KEY를 입력하세요.');
  if(!confirm('참가자와 레이스를 전부 초기화할까요?')) return;
  try{
    await api('/api/admin/reset',{
      method:'POST',
      headers:{'Authorization':'Bearer ' + key}
    });
    bgm.pause();
    bgm.currentTime = 0;
    finishShown = false;
    state = {racers:[],race:null};
    lastSignature = '';
    await poll();
  }catch(e){
    alert(e.message);
  }
}

function toggleMusic(){
  musicEnabled = !musicEnabled;
  $('musicBtn').textContent = musicEnabled ? '🎵 음악 ON' : '🔇 음악 OFF';
  if(!musicEnabled){
    bgm.pause();
  }else if(state.race && (Date.now() - state.race.startedAt) < durationMs){
    bgm.play().catch(()=>{});
  }
}

window.loadComments = loadComments;
window.startRace = startRace;
window.resetRace = resetRace;
window.toggleMusic = toggleMusic;
window.findMyPig = findMyPig;
window.showAllPigs = showAllPigs;

initScene();
loadPigModel();
if(selectedPigName) $('myPigName').value = selectedPigName;
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
