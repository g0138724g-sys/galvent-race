<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>갤벤 레이스</title>
<style>
*{box-sizing:border-box}
:root{--ink:#202431}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;color:var(--ink);background:linear-gradient(#86d9ff 0 26%,#b9ecff 26% 34%,#72ba59 34% 100%)}
.wrap{max-width:1600px;margin:auto;padding:14px}
.title{text-align:center;font-size:38px;font-weight:1000;margin:2px 0 4px}
.sub{text-align:center;font-size:14px;font-weight:800;color:#3c4960;margin-bottom:12px}
.panel{background:#ffffffef;border:2px solid #fff;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 7px 22px #0002}
.viewerBar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center}
.viewerBar input{width:min(360px,100%);font:inherit;padding:10px 12px;border-radius:11px;border:2px solid #dde3eb}
.viewerBar button{font:inherit;padding:10px 12px;border:0;border-radius:11px;font-weight:900;cursor:pointer}
.btn-my{background:#ffc8dc}.btn-all{background:#cce8ff}
.status{text-align:center;margin-top:8px;font-weight:1000}.substatus{text-align:center;margin-top:4px;font-size:13px;color:#667182}
.raceGrid{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:12px;align-items:stretch}
.raceShell{position:relative;height:72vh;min-height:590px;overflow-x:hidden;overflow-y:auto;border-radius:18px;background:linear-gradient(#7bd4fb 0 25%,#e7f8ff 25% 34%,#67ad52 34% 42%,#c98851 42% 100%);border:4px solid #fff;box-shadow:0 8px 22px #0002}
.sideBar{display:flex;flex-direction:column;gap:10px}.infoBox,.top10Box{background:#ffffffee;border:2px solid #fff;border-radius:17px;box-shadow:0 6px 16px #0002;padding:12px}.infoBox{text-align:center;font-weight:1000;line-height:1.55}.top10Box{flex:1;min-height:0}.top10Title{text-align:center;font-size:15px;font-weight:1000;margin-bottom:7px}.top10List{display:flex;flex-direction:column;gap:5px}.top10Row{display:grid;grid-template-columns:36px minmax(0,1fr);gap:7px;align-items:center;padding:7px 8px;background:#f5f6f8;border-radius:9px;font-size:12px;font-weight:1000}.top10Row span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top10Row.me{background:#ffd7e8;outline:2px solid #ff7fb3}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.86}.c1{width:180px;height:52px;left:7%;top:8%}.c2{width:240px;height:62px;right:9%;top:13%}.hills{position:absolute;left:0;right:0;top:29%;height:15%;background:linear-gradient(160deg,#67a85a 0 20%,#86bf6c 20% 36%,#5c9b54 36% 55%,#78b465 55% 100%);clip-path:polygon(0 70%,13% 36%,24% 62%,39% 18%,53% 67%,69% 32%,83% 61%,100% 28%,100% 100%,0 100%)}.trackLines{position:absolute;inset:42% 0 0;background:repeating-linear-gradient(to bottom,transparent 0 9.75%,rgba(255,255,255,.23) 9.75% 10%)}.start{position:absolute;left:6%;top:42%;bottom:0;width:6px;background:#fff9}.finish{position:absolute;right:5%;top:42%;bottom:0;width:16px;background:repeating-linear-gradient(to bottom,#fff 0 12px,#111 12px 24px);box-shadow:0 0 0 4px #fff5}.finishLabel{position:absolute;left:14px;top:14px;background:#ffffffed;border-radius:12px;padding:9px 12px;font-size:20px;font-weight:1000;box-shadow:0 5px 12px #0002}.raceLayer{position:absolute;left:0;right:0;top:42%;min-height:58%;overflow:visible;padding-bottom:20px}
.racer{position:absolute;left:0;top:0;width:64px;height:44px;will-change:transform;transform-origin:50% 100%;pointer-events:none}
.racer.running{transition:transform .38s linear}.pigSprite{position:absolute;left:10px;bottom:0;width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.racer.running .pigSprite{animation:runBob .22s ease-in-out infinite alternate}.racer.me .pigSprite{filter:drop-shadow(0 0 5px #ff47a1) drop-shadow(0 0 10px #fff)}.nameTag{position:absolute;left:50%;bottom:37px;transform:translateX(-50%);max-width:122px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 5px;border-radius:5px;background:#ffffffe0;color:#1f2430;font-size:8px;font-weight:1000;line-height:1.15}.placeTag{position:absolute;right:0;bottom:1px;background:#252936;color:#fff;border-radius:999px;padding:2px 5px;font-size:8px;font-weight:1000}.meTag{position:absolute;left:50%;bottom:47px;transform:translateX(-50%);background:#ffe2ef;border:1px solid #ff5aa1;border-radius:999px;padding:2px 5px;font-size:8px;font-weight:1000;display:none}.racer.me .meTag{display:block}@keyframes runBob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-3px) rotate(2deg)}}.racer.winner .pigSprite{animation:winnerDance .38s ease-in-out infinite alternate}@keyframes winnerDance{from{transform:translateY(0) rotate(-10deg) scale(1)}to{transform:translateY(-11px) rotate(10deg) scale(1.12)}}
.timerBadge,.myPigBadge,.winnerBanner,.waitingOverlay{position:absolute;z-index:20;box-shadow:0 5px 14px #0002}.timerBadge{left:14px;top:64px;background:#ffffffed;padding:8px 11px;border-radius:11px;font-size:18px;font-weight:1000}.myPigBadge{left:50%;top:14px;transform:translateX(-50%);background:#ffffffed;padding:8px 12px;border:2px solid #ff91bb;border-radius:12px;font-size:13px;font-weight:1000;display:none}.winnerBanner{left:50%;bottom:15px;transform:translateX(-50%);padding:13px 20px;border-radius:16px;background:#fff1a5;border:2px solid #ffe15a;font-size:25px;font-weight:1000;display:none}.waitingOverlay{left:50%;top:50%;transform:translate(-50%,-50%);background:#ffffffee;border-radius:22px;padding:20px 28px;text-align:center;font-weight:1000;font-size:28px;min-width:290px}.waitingOverlay small{display:block;margin-top:8px;font-size:13px;color:#657084}
.lower{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:12px}.listBox{max-height:310px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:7px;margin-top:9px}.person{background:#f4f6f8;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:800}.ranking{max-height:310px;overflow:auto;margin-top:9px}.rankRow{display:flex;justify-content:space-between;padding:7px 9px;border-radius:8px;background:#f7f7f8;margin-bottom:5px;font-size:12px;font-weight:900}.rankRow.top1{background:#fff0a8}
@media(max-width:1100px){.raceGrid{grid-template-columns:1fr}.sideBar{display:grid;grid-template-columns:180px 1fr}.raceShell{height:68vh}}@media(max-width:700px){.title{font-size:30px}.raceShell{min-height:520px}.sideBar{grid-template-columns:1fr}.lower{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">🏁 갤벤 레이스 🐷</div>
  <div class="sub">공개 관전 페이지 · 모든 참가자 표시 · 아래로 스크롤해서 전원 확인 가능</div>

  <div class="panel">
    <div class="viewerBar">
      <input id="myPigName" placeholder="내 닉네임 입력">
      <button class="btn-my" onclick="findMyPig()">🐷 내 돼지 보기</button>
      <button class="btn-all" onclick="showAllPigs()">🏁 전체보기</button>
    </div>
    <div class="status" id="status">참가자 0명</div>
    <div class="substatus" id="substatus">레이스 준비 중</div>
  </div>

  <div class="raceGrid">
    <div class="raceShell">
      <div class="cloud c1"></div><div class="cloud c2"></div><div class="hills"></div>
      <div class="start"></div><div class="finish"></div><div class="trackLines"></div>
      <div class="finishLabel">🏁 FINISH!</div>
      <div class="raceLayer" id="raceLayer"></div>
      <div class="timerBadge" id="timer">대기 중</div>
      <div class="myPigBadge" id="myPigBadge"></div>
      <div class="winnerBanner" id="winnerBanner"></div>
      <div class="waitingOverlay" id="waitingOverlay">레이스 대기 중<small>운영자가 시작하면 자동으로 카운트다운됩니다.</small></div>
    </div>

    <aside class="sideBar">
      <div class="infoBox" id="sceneInfo">참가자 0명<br>30초 레이스</div>
      <div class="top10Box"><div class="top10Title">LIVE TOP 10 · 전체 참가자는 경기장 스크롤</div><div class="top10List" id="top10List">레이스 대기중</div></div>
    </aside>
  </div>

  <div class="lower">
    <div class="panel"><b>🐷 참가자 명단</b><div class="listBox" id="list"></div></div>
    <div class="panel"><b>🏆 최종 순위</b><div class="ranking" id="ranking"><div class="rankRow"><span>레이스 종료 후 공개</span><span>🏁</span></div></div></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let state={racers:[],race:null},live={positions:[]},roster=[];
let selectedPigName=localStorage.getItem('galvent_my_pig')||'',cameraMode=selectedPigName?'mine':'all';
let racerEls=new Map(),lastSig='',clockOffset=0,lastProgress=new Map();

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function getJSON(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('서버 연결 실패');return r.json()}
function nowServer(){return Date.now()+clockOffset}

function renderParticipants(){
  $('list').innerHTML=state.racers.length?state.racers.map((r,i)=>`<div class="person">${i+1}. ${esc(r.nickname)}</div>`).join(''):'<div class="person">아직 참가자가 없습니다.</div>';
}
function liveMap(){return new Map((live.positions||[]).map(x=>[x.nickname,x]))}
function visibleNames(){
  if(!roster.length)return [];
  return roster.map(r=>r.nickname);
}
function buildRacers(){
  const names=visibleNames(),sig=names.join('|')+'|'+cameraMode+'|'+selectedPigName;
  if(sig===lastSig)return;
  lastSig=sig;racerEls.clear();$('raceLayer').innerHTML='';
  names.forEach(name=>{
    const el=document.createElement('div');
    el.className='racer'+(name===selectedPigName?' me':'');
    el.innerHTML=`<div class="meTag">⭐ 내 돼지</div><div class="nameTag">${esc(name)}</div><img class="pigSprite" src="/pig-runner-transparent.png" alt=""><div class="placeTag"></div>`;
    $('raceLayer').appendChild(el);racerEls.set(name,el);
  });
}
function renderRacers(){
  buildRacers();

  const lm=liveMap();
  const names=[...racerEls.keys()];
  const layer=$('raceLayer');
  const w=layer.clientWidth;

  const startX=Math.max(10,w*.045);
  const finishX=w*.90;
  const rows=Math.max(1,names.length);

  // 전원 표시: 참가자 수에 맞춰 레이스 영역 자체를 길게 만들고 세로 스크롤로 모두 볼 수 있게 함.
  const lane=28;
  const contentHeight=Math.max(320,rows*lane+70);
  layer.style.height=contentHeight+'px';

  const shell=$('.raceShell');
  const minShellHeight=Math.max(590,Math.min(900,contentHeight+250));
  shell.style.minHeight=minShellHeight+'px';

  const scale=rows>120?.52:rows>90?.58:rows>60?.64:rows>35?.72:.82;

  const phase=live.phase||state.race?.phase||'idle';
  const running=phase==='running';
  const finished=phase==='finished';

  names.forEach((name,i)=>{
    const el=racerEls.get(name);
    const d=lm.get(name);

    let prog=d?.progress||0;

    if(!running && !finished){
      prog=0;
      lastProgress.set(name,0);
    }else{
      const prev=lastProgress.get(name)||0;
      prog=Math.max(prev,prog);
      lastProgress.set(name,prog);
    }

    const x=startX+(finishX-startX)*prog;
    const y=8+i*lane;

    el.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
    el.querySelector('.placeTag').textContent=running||finished ? (d?.livePlace?`${d.livePlace}위`:'') : '';

    el.style.display='block';
    el.classList.toggle('running',running);
    el.classList.toggle('winner',finished&&state.race?.winner===name);
  });
}
function renderTop10(){
  const rows=(live.positions||[]).slice(0,10);
  $('top10List').innerHTML=rows.length?rows.map((r,i)=>`<div class="top10Row ${r.nickname===selectedPigName?'me':''}"><span>${i+1}위</span><span>${esc(r.nickname)}</span></div>`).join(''):'레이스 대기중';
}
function renderRanking(){
  if(state.race?.phase!=='finished'||!state.race?.order){
    $('ranking').innerHTML='<div class="rankRow"><span>레이스 종료 후 공개</span><span>🏁</span></div>';return;
  }
  $('ranking').innerHTML=state.race.order.map((r,i)=>`<div class="rankRow ${i===0?'top1':''}"><span>${i+1}위. ${esc(r.nickname)}</span><span>${i===0?'🏆':''}</span></div>`).join('');
}
function updateClock(){
  const r=state.race,now=nowServer();
  $('status').textContent=`참가자 ${roster.length}명`;
  $('sceneInfo').innerHTML=`참가자 ${roster.length}명<br>30초 레이스`;

  if(!r){
    $('timer').textContent='대기 중';
    $('substatus').textContent='운영자가 레이스를 예약하면 자동으로 시작됩니다.';
    $('waitingOverlay').style.display='block';
    $('waitingOverlay').innerHTML='레이스 대기 중<small>운영자가 시작하면 자동으로 카운트다운됩니다.</small>';
    return;
  }

  if(now<r.startAt){
    const left=Math.max(0,r.startAt-now);
    $('timer').textContent=`출발 ${(left/1000).toFixed(1)}초 전`;
    $('substatus').textContent='레이스가 곧 시작됩니다. 이 페이지를 그대로 보고 계세요.';
    $('waitingOverlay').style.display='block';
    $('waitingOverlay').innerHTML=`${Math.ceil(left/1000)}<small>초 뒤 자동 출발</small>`;
  }else if(now<r.endAt){
    const left=Math.max(0,r.endAt-now);
    $('timer').textContent=`⏱ ${(left/1000).toFixed(1)}초`;
    $('substatus').textContent='레이스 진행 중!';
    $('waitingOverlay').style.display='none';
  }else{
    $('timer').textContent='🏁 FINISH!';
    $('substatus').textContent=r.winner?`레이스 종료 · 1등 ${r.winner}`:'레이스 종료';
    $('waitingOverlay').style.display='none';
    if(r.winner){
      $('winnerBanner').style.display='block';
      $('winnerBanner').textContent=`🏆 1등 ${r.winner} 🐷`;
    }
  }
}
function findMyPig(){
  const q=$('myPigName').value.trim();if(!q)return alert('내 닉네임을 입력하세요.');
  const exact=roster.find(r=>r.nickname===q),parts=roster.filter(r=>r.nickname.toLowerCase().includes(q.toLowerCase()));
  const target=exact||((parts.length===1)?parts[0]:null);
  if(!target)return alert(parts.length>1?'비슷한 닉네임이 여러 개 있습니다. 정확하게 입력하세요.':'참가자 명단에서 닉네임을 찾지 못했습니다.');
  selectedPigName=target.nickname;cameraMode='mine';localStorage.setItem('galvent_my_pig',selectedPigName);$('myPigName').value=selectedPigName;lastSig='';updateMyBadge();
}
function showAllPigs(){cameraMode='all';lastSig='';$('myPigBadge').style.display='none'}
function updateMyBadge(){
  const b=$('myPigBadge');
  if(cameraMode!=='mine'||!selectedPigName||!roster.some(r=>r.nickname===selectedPigName)){b.style.display='none';return}
  const d=liveMap().get(selectedPigName);
  b.style.display='block';b.textContent=d?.livePlace?`⭐ ${selectedPigName} · 현재 ${d.livePlace}위`:`⭐ ${selectedPigName} · 내 돼지`;
}

async function refreshState(){
  try{
    const d=await getJSON('/api/state');
    const oldNames=roster.map(r=>r.nickname).join('|');

    state=d;
    clockOffset=(d.serverNow||Date.now())-Date.now();

    // 참가자가 실제로 있을 때만 로스터 갱신.
    // 폴링 순간 빈 배열이 와도 화면의 돼지가 사라지지 않게 유지.
    if(Array.isArray(d.racers) && d.racers.length){
      roster=d.racers;
    }else if(!d.race && Array.isArray(d.racers) && d.racers.length===0){
      // 명시적 초기화 상태에서만 비움
      roster=[];
    }

    const newNames=roster.map(r=>r.nickname).join('|');
    if(oldNames!==newNames) lastSig='';

    if(!state.race) lastProgress.clear();

    renderParticipants();
    renderRanking();
  }catch(e){}
}
async function refreshLive(){
  try{
    const d=await getJSON('/api/live');
    live=d;clockOffset=(d.serverNow||Date.now())-Date.now();
    renderTop10();renderRacers();updateMyBadge();
    if(d.phase==='finished') refreshState();
  }catch(e){}
}

if(selectedPigName)$('myPigName').value=selectedPigName;
window.findMyPig=findMyPig;window.showAllPigs=showAllPigs;
refreshState();refreshLive();
setInterval(refreshState,1500);
setInterval(refreshLive,450);
setInterval(()=>{updateClock();renderRacers();updateMyBadge()},100);
</script>
</body>
</html>
