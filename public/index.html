<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>갤벤 레이스</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,"Noto Sans KR",sans-serif;
      background:linear-gradient(180deg,#89d7ff 0%,#c8f0ff 35%,#7cc46a 35%,#5aa14a 100%);
      color:#1f2430;
    }
    .wrap{max-width:1400px;margin:auto;padding:18px}
    .title{font-size:40px;font-weight:900;text-align:center;margin:4px 0 8px}
    .sub{text-align:center;margin-bottom:14px;color:#234}
    .panel{
      background:#ffffffee;
      border-radius:22px;
      padding:16px;
      margin-bottom:14px;
      box-shadow:0 8px 22px #0002;
      border:2px solid #ffffff;
    }
    .controls{
      display:grid;
      grid-template-columns:1fr 2fr repeat(4,auto);
      gap:8px;
      align-items:center;
    }
    input,button{
      font:inherit;
      padding:12px 14px;
      border-radius:12px;
      border:2px solid #d7dfe9;
    }
    input{background:#fff}
    button{
      border:0;
      font-weight:900;
      cursor:pointer;
    }
    .btn-load{background:#ffd65b}
    .btn-start{background:#ff8c8c}
    .btn-reset{background:#ddd}
    .btn-music{background:#b7d7ff}
    .status{margin-top:10px;text-align:center;font-weight:900}
    .substatus{margin-top:6px;text-align:center;font-size:13px;color:#5a6475}
    .scenePanel{padding:10px}
    #sceneWrap{
      position:relative;
      width:100%;
      height:72vh;
      min-height:520px;
      border-radius:20px;
      overflow:hidden;
      background:linear-gradient(180deg,#8fd9ff 0%,#daf7ff 40%,#88cf74 40%,#64ad52 100%);

      border-radius:14px;
      padding:10px 14px;
      font-size:22px;

      box-shadow:0 4px 14px #0002;
    }
    .infoBadge{

      border-radius:14px;

      text-align:right;

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';

const $ = id => document.getElementById(id);

let state = { racers: [], race: null };
let scene, camera, renderer, clock;
let pigs = [];
let worldGroup = null;
let lastSignature = '';
let musicEnabled = true;
let finishShown = false;
let selectedPigName = localStorage.getItem('galvent_my_pig') || '';
let cameraMode = selectedPigName ? 'mine' : 'all';
let pigTemplate = null;
let pigModelReady = false;
let pigModelError = '';
const pigModelUrls = ['/piggu.glb','/piggu_test.glb','/piggu_web.glb'];
const _axisX = new THREE.Vector3(1,0,0);
const _axisZ = new THREE.Vector3(0,0,1);
const _tmpQ = new THREE.Quaternion();
const _tmpQ2 = new THREE.Quaternion();
const _tmpQ3 = new THREE.Quaternion();
const _tmpQ4 = new THREE.Quaternion();
const _tmpV = new THREE.Vector3();
const durationMs = 30000;
const bgm = new Audio('/race.mp3');
bgm.loop = true;
bgm.volume = 0.55;

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(url,opt={}){
  const r = await fetch(url,opt);
  const d = await r.json().catch(()=>({error:'서버 응답 오류'}));
  if(!r.ok) throw Error(d.error || '오류가 발생했습니다.');
  return d;
}

function setStatus(t){ $('status').textContent = t; }
function setSub(t){ $('substatus').textContent = t; }

function initScene(){
  const canvas = $('scene');
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:false,
    alpha:true,
    powerPreference:'high-performance'
  });
  renderer.setPixelRatio(0.85);
  renderer.setSize($('sceneWrap').clientWidth, $('sceneWrap').clientHeight, false);
  renderer.shadowMap.enabled = false;

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xdff6ff, 40, 140);

  camera = new THREE.PerspectiveCamera(
    48,
    $('sceneWrap').clientWidth / $('sceneWrap').clientHeight,
    0.1,
    400
  );
  camera.position.set(15, 28, 34);
  camera.lookAt(6, 0, 0);

  clock = new THREE.Clock();

  const hemi = new THREE.HemisphereLight(0xffffff, 0x6dbd66, 1.2);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 1.25);
  dir.position.set(15, 30, 16);
  dir.castShadow = false;
  dir.shadow.mapSize.set(2048,2048);
  dir.shadow.camera.left = -80;
  dir.shadow.camera.right = 80;
  dir.shadow.camera.top = 80;
  dir.shadow.camera.bottom = -80;
  scene.add(dir);

  window.addEventListener('resize', onResize);
  animate();
}

function onResize(){
  const w = $('sceneWrap').clientWidth;
  const h = $('sceneWrap').clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function makeLabel(text){
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 128;
  const ctx = c.getContext('2d');

  ctx.fillStyle = 'rgba(255,255,255,0.96)';
  roundRect(ctx, 0, 18, 512, 84, 24);
  ctx.fill();

  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 3;
  roundRect(ctx, 1.5, 19.5, 509, 81, 22);
  ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.font = 'bold 42px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const clipped = text.length > 14 ? text.slice(0,14) + '…' : text;
  ctx.fillText(clipped, 256, 60);

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4.8, 1.2, 1);
  return sprite;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}


function makeMyMarker(){
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 160;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(255,236,246,0.98)';
  roundRect(ctx, 12, 22, 488, 110, 34);
  ctx.fill();
  ctx.strokeStyle = '#ff5fa3';
  ctx.lineWidth = 8;
  roundRect(ctx, 12, 22, 488, 110, 34);
  ctx.stroke();
  ctx.fillStyle = '#ff297f';
  ctx.font = '900 45px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⭐ 내 돼지', 256, 77);
  const tex = new THREE.CanvasTexture(c);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sprite.scale.set(4.8,1.5,1);
  sprite.position.set(0,3.2,0);
  sprite.visible = false;
  return sprite;
}

function findBone(root, candidates){
  for(const n of candidates){
    const exact = root.getObjectByName(n);
    if(exact && exact.isBone) return exact;
  }
  const wanted = candidates.map(x=>x.toLowerCase());
  let found = null;
  root.traverse(o=>{
    if(found || !o.isBone) return;
    const n = String(o.name || '').toLowerCase();
    if(wanted.includes(n)) found = o;
  });
  return found;
}

function captureRig(model){
  const bones = {
    armL: findBone(model,['arm_ref.l']),
    armR: findBone(model,['arm_ref.r']),
    forearmL: findBone(model,['forearm_ref.l']),
    forearmR: findBone(model,['forearm_ref.r']),
    handL: findBone(model,['hand_ref.l']),
    handR: findBone(model,['hand_ref.r']),
    thighL: findBone(model,['thigh_ref.l']),
    thighR: findBone(model,['thigh_ref.r']),
    legL: findBone(model,['leg_ref.l']),
    legR: findBone(model,['leg_ref.r']),
    footL: findBone(model,['foot_ref.l']),
    footR: findBone(model,['foot_ref.r']),
    spine1: findBone(model,['spine_01_ref.x']),
    spine2: findBone(model,['spine_02_ref.x']),
    spine3: findBone(model,['spine_03_ref.x']),
    neck: findBone(model,['neck_ref.x']),
    head: findBone(model,['head_ref.x'])
  };

  // 중요: 이 Piggu 리그의 bone local axis는 팔/다리마다 제각각임.
  // 그래서 local Euler를 억지로 넣지 않고, "모델 좌표계" 기준 회전을
  // 각 bone의 parent-local quaternion으로 변환해서 적용한다.
  model.updateWorldMatrix(true,true);
  const modelWorldQ = new THREE.Quaternion();
  model.getWorldQuaternion(modelWorldQ);
  const invModelWorldQ = modelWorldQ.clone().invert();

  const restModel = {};
  for(const [k,b] of Object.entries(bones)){
    if(!b) continue;
    const bw = new THREE.Quaternion();
    b.getWorldQuaternion(bw);
    restModel[k] = invModelWorldQ.clone().multiply(bw);
  }

  return {bones,restModel,modelRoot:model};
}

function setBoneModelPose(rig,key,xAngle=0,zAngle=0){
  const bone = rig.bones[key];
  const rest = rig.restModel[key];
  if(!bone || !rest || !bone.parent) return;

  // 원하는 절대 자세를 Piggu 원본 모델 좌표계에서 만든다.
  // 원본: +Z = 얼굴/진행방향, +Y = 위, +X = 좌우.
  _tmpQ.copy(rest);

  if(Math.abs(zAngle) > 1e-6){
    _tmpQ2.setFromAxisAngle(_axisZ,zAngle);
    _tmpQ.premultiply(_tmpQ2);
  }
  if(Math.abs(xAngle) > 1e-6){
    _tmpQ2.setFromAxisAngle(_axisX,xAngle);
    _tmpQ.premultiply(_tmpQ2);
  }

  // model-space desired quaternion -> 현재 parent-local quaternion
  rig.modelRoot.updateWorldMatrix(true,false);
  bone.parent.updateWorldMatrix(true,false);

  rig.modelRoot.getWorldQuaternion(_tmpQ2);
  bone.parent.getWorldQuaternion(_tmpQ3);

  // parent orientation relative to model
  _tmpQ4.copy(_tmpQ2).invert().multiply(_tmpQ3);

  // local = inverse(parentModel) * desiredModel
  _tmpQ4.invert().multiply(_tmpQ);
  bone.quaternion.copy(_tmpQ4);
  bone.updateMatrixWorld(true);
}

function makeNameTag(name){
  const el = document.createElement('div');
  el.className = 'pigNameTag';
  el.textContent = name;
  $('nameLayer').appendChild(el);
  return el;
}


function isRigHelper(o){
  const n = String(o.name || '').toLowerCase();
  return n.startsWith('wgt-') || n.startsWith('wgt_') ||
         n.includes('custom_shape') || n.includes('widget') ||
         n.includes('rig_ui') || n.includes('metarig');
}

function characterBounds(model){
  const skinnedBox = new THREE.Box3();
  let skinnedCount = 0;
  model.updateMatrixWorld(true);
  model.traverse(o=>{
    if(o.isSkinnedMesh && !isRigHelper(o)){
      skinnedBox.expandByObject(o, true);
      skinnedCount++;
    }
  });
  if(skinnedCount && !skinnedBox.isEmpty()) return skinnedBox;

  const meshBox = new THREE.Box3();
  model.traverse(o=>{
    if(o.isMesh && !isRigHelper(o) && o.visible !== false){
      meshBox.expandByObject(o, true);
    }
  });
  return meshBox;
}


function optimizePigRig(root){
  const skinned = [];
  root.traverse(o=>{
    if(o.isSkinnedMesh && o.skeleton && o.geometry?.getAttribute('skinIndex')){
      skinned.push(o);
    }
  });
  if(!skinned.length) return {before:0,after:0};

  const referenceSkeleton = skinned[0].skeleton;
  const before = referenceSkeleton.bones.length;
  const used = new Set();

  // Draco가 풀린 뒤 실제 vertex weight를 보고 "진짜로 쓰는 joint"만 찾는다.
  for(const mesh of skinned){
    const si = mesh.geometry.getAttribute('skinIndex');
    const sw = mesh.geometry.getAttribute('skinWeight');
    if(!si || !sw) continue;

    const itemSize = Math.min(si.itemSize,sw.itemSize);
    for(let i=0;i<si.count;i++){
      const baseI = i*si.itemSize;
      const baseW = i*sw.itemSize;
      for(let c=0;c<itemSize;c++){
        const w = sw.array[baseW+c];
        if(w !== 0) used.add(Number(si.array[baseI+c]));
      }
    }
  }

  const usedOld = [...used].sort((a,b)=>a-b);
  const remap = new Map(usedOld.map((oldIndex,newIndex)=>[oldIndex,newIndex]));

  for(const mesh of skinned){
    const oldSkeleton = mesh.skeleton;
    const geo = mesh.geometry.clone();
    const si = geo.getAttribute('skinIndex');
    const sw = geo.getAttribute('skinWeight');

    if(si && sw){
      const itemSize = Math.min(si.itemSize,sw.itemSize);
      for(let i=0;i<si.count;i++){
        const baseI = i*si.itemSize;
        const baseW = i*sw.itemSize;
        for(let c=0;c<itemSize;c++){
          const w = sw.array[baseW+c];
          const oldIndex = Number(si.array[baseI+c]);
          si.array[baseI+c] = w !== 0 ? (remap.get(oldIndex) ?? 0) : 0;
        }
      }
      si.needsUpdate = true;
    }

    mesh.geometry = geo;

    const bones = usedOld.map(i=>oldSkeleton.bones[i]).filter(Boolean);
    const inverses = usedOld.map(i=>oldSkeleton.boneInverses[i]?.clone() ?? new THREE.Matrix4());
    const reducedSkeleton = new THREE.Skeleton(bones,inverses);
    mesh.bind(reducedSkeleton,mesh.bindMatrix.clone());
  }

  // skin에는 안 쓰면서 Rigify가 내보낸 수백 개 control branch도 제거.
  const keep = new Set([root,...skinned]);
  for(const oldIndex of usedOld){
    let o = referenceSkeleton.bones[oldIndex];
    while(o){
      keep.add(o);
      if(o === root) break;
      o = o.parent;
    }
  }

  const prune = [];
  root.traverse(o=>{
    if(o === root || o.isSkinnedMesh) return;
    if(o.parent && keep.has(o.parent) && !keep.has(o)){
      prune.push(o);
    }
  });
  for(const o of prune) o.removeFromParent();

  return {before,after:usedOld.length};
}

function createPig(name, index, total, laneZ, startX, finishX){
  const g = new THREE.Group();
  const facing = new THREE.Group();
  const model = cloneSkeleton(pigTemplate);

  model.traverse(o=>{
    if(o.isMesh){
      o.visible = true;
      o.castShadow = false;
      o.receiveShadow = false;
      // 눈/코/몸이 별도 SkinnedMesh라 부분 소실 방지
      o.frustumCulled = false;
      if(o.material){
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for(const m of mats){
          m.side = THREE.DoubleSide;
        }
      }
    }
  });

  /*
    업로드한 piggu.glb 실제 mesh bounds를 다시 확인함:
    Y 약 0.01 ~ 13.48. 따라서 동적 Box3 재센터링을 하지 않고
    원본 중심/발 위치를 그대로 쓰는 게 가장 안전함.
  */
  model.scale.setScalar(0.130);
  model.position.set(0,0,0);

  // 원본 Piggu는 +Z를 바라봄. 레이스 결승선은 +X.
  facing.rotation.set(0,Math.PI/2,0);
  facing.add(model);
  g.add(facing);

  const labelEl = makeNameTag(name);
  const baseY = -1.33;
  g.position.set(startX,baseY,laneZ);

  g.updateWorldMatrix(true,true);
  const rig = captureRig(model);

  g.userData = {
    name,index,startX,finishX,laneZ,baseY,
    model,facing,rig,labelEl,
    seed:index*0.73+1.1,
    displayHeight:1.76
  };
  return g;
}

function racersFor3D(){
  const byName = new Map(state.racers.map(r=>[r.nickname,r]));
  let names = [];

  if(state.race?.order?.length){
    names = state.race.order.slice(0,10).map(r=>r.nickname);
  }else{
    names = state.racers.slice(0,10).map(r=>r.nickname);
  }

  if(selectedPigName && byName.has(selectedPigName) && !names.includes(selectedPigName)){
    names.push(selectedPigName);
  }

  return names.map(n=>byName.get(n)).filter(Boolean);
}

async function loadPigModel(){
  const loader = new GLTFLoader();

  // Blender에서 Draco Compression으로 내보낸 GLB를 읽기 위한 디코더
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('https://unpkg.com/three@0.166.1/examples/jsm/libs/draco/gltf/');
  dracoLoader.preload();
  loader.setDRACOLoader(dracoLoader);

  let lastErr = null;

  for(const url of pigModelUrls){
    try{
      const gltf = await loader.loadAsync(url);

      // 실제 업로드된 GLB에는 캐릭터가 2세트 + Rigify 보조도형이 함께 들어있음.
      // 화면에는 첫 번째 실제 캐릭터 rig만 사용해서 렉/검은 보조도형을 제거.
      const sourceRig = gltf.scene.getObjectByName('rig');
      if(!sourceRig) throw new Error('Piggu rig node not found');

      // 파일 안에 char_grp / char_grp.001 두 캐릭터가 중복으로 들어있음.
      // 첫 번째 실제 rig만 떼어내고, 실제 vertex가 쓰는 joint만 남긴다.
      sourceRig.removeFromParent();
      const rigStats = optimizePigRig(sourceRig);

      pigTemplate = sourceRig;
      pigTemplate.updateMatrixWorld(true);
      pigModelReady = true;
      pigModelError = '';
      console.log(`Piggu rig optimized: ${rigStats.before} -> ${rigStats.after} joints`);
      setSub('3D 돼지 모델 준비 완료');
      lastSignature = '';
      maybeRebuildWorld();
      return;
    }catch(e){
      lastErr = e;
    }
  }

  pigModelError = 'piggu.glb를 불러오지 못했습니다.';
  console.error('Piggu GLB load error:', lastErr);
  setSub('3D 돼지 모델 로딩 실패 · public/piggu.glb 파일명/배포 상태 확인');
}

function clearNameLabels(){
  const layer = $('nameLayer');
  while(layer.firstChild) layer.removeChild(layer.firstChild);
}

function buildWorld(){
  if(worldGroup) scene.remove(worldGroup);
  clearNameLabels();

  if(!pigModelReady || !pigTemplate){
    worldGroup = null;
    $('sceneInfo').innerHTML = pigModelError ? '3D 모델 오류' : '🐷 3D 돼지 로딩중...';
    return;
  }

  worldGroup = new THREE.Group();
  pigs = [];
  finishShown = false;
  $('winnerBanner').style.display = 'none';
  $('winnerBanner').textContent = '';

  const visualRacers = racersFor3D();
  const count = visualRacers.length;
  const totalParticipants = state.racers.length;

  // 고퀄 리깅 캐릭터는 TOP10(+내 돼지)만 렌더해서 렉을 크게 줄임.
  const laneGap = 2.45;
  const startX = -22;
  const finishX = 22;
  const totalDepth = Math.max(22,count*laneGap+5);

  const grass = new THREE.Mesh(
    new THREE.PlaneGeometry(72,totalDepth+18),
    new THREE.MeshStandardMaterial({color:0x6fbe5f,roughness:1})
  );
  grass.rotation.x = -Math.PI/2;
  grass.position.y = -1.42;
  worldGroup.add(grass);

  const track = new THREE.Mesh(
    new THREE.PlaneGeometry(54,totalDepth),
    new THREE.MeshStandardMaterial({color:0xb47c4b,roughness:1})
  );
  track.rotation.x = -Math.PI/2;
  track.position.y = -1.35;
  worldGroup.add(track);

  for(let i=0;i<count;i++){
    const z = (i-(count-1)/2)*laneGap;
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(52,0.045),
      new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.32})
    );
    line.rotation.x = -Math.PI/2;
    line.position.set(0,-1.315,z+laneGap/2);
    worldGroup.add(line);
  }

  const startLine = new THREE.Mesh(
    new THREE.BoxGeometry(0.35,0.02,totalDepth),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  startLine.position.set(startX-0.8,-1.24,0);
  worldGroup.add(startLine);

  // 결승선은 타일 수를 줄여 draw call 절약
  const finishLine = new THREE.Mesh(
    new THREE.BoxGeometry(0.55,0.025,totalDepth),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  finishLine.position.set(finishX,-1.23,0);
  worldGroup.add(finishLine);

  for(let i=0;i<count;i++){
    const z = (i-(count-1)/2)*laneGap;
    const racer = visualRacers[i];
    const globalIndex = state.racers.findIndex(r=>r.nickname===racer.nickname);
    const pig = createPig(racer.nickname,globalIndex,totalParticipants,z,startX,finishX);
    pigs.push(pig);
    worldGroup.add(pig);
  }

  scene.add(worldGroup);

  // 전체보기: 앞쪽 3/4 TV 카메라. 돼지들은 +X(결승선)을 바라본다.
  camera.position.set(-10,6.8,17);
  camera.lookAt(-17,0.4,0);

  $('sceneInfo').innerHTML =
    `참가자 ${totalParticipants}명<br>3D TOP 10${selectedPigName?' + 내 돼지':''}`;

  renderParticipants();
  refreshMyPigSelection();
  renderTop10();
  renderRanking();
}

function renderParticipants(){
  $('list').innerHTML = state.racers.length
    ? state.racers.map((r,i)=>`<div class="person">${i+1}. ${esc(r.nickname)}</div>`).join('')
    : `<div class="person">아직 참가자가 없습니다.</div>`;
}


function refreshMyPigSelection(){
  let found = false;
  for(const pig of pigs){
    const isMine = !!selectedPigName && pig.userData.name === selectedPigName;
    if(pig.userData.myMarker) pig.userData.myMarker.visible = isMine;
    if(pig.userData.label){
      pig.userData.label.material.opacity = isMine ? 1 : (cameraMode === 'mine' ? 0.45 : 0.9);
    }
    if(isMine) found = true;
  }
  const badge = $('myPigBadge');
  if(cameraMode === 'mine' && selectedPigName && found){
    badge.style.display = 'block';
  }else{
    badge.style.display = 'none';
  }
}

function currentPlaceOf(name){
  const item = state.race?.order?.find(x=>x.nickname===name);
  return item?.place || null;
}

function updateMyPigBadge(){
  const badge = $('myPigBadge');
  if(cameraMode !== 'mine' || !selectedPigName){
    badge.style.display = 'none';
    return;
  }
  const pig = pigs.find(p=>p.userData.name===selectedPigName);
  if(!pig){
    badge.style.display = 'none';
    return;
  }
  const place = currentPlaceOf(selectedPigName);
  badge.style.display = 'block';
  badge.textContent = place ? `⭐ ${selectedPigName} · 현재 ${place}등` : `⭐ ${selectedPigName} · 내 돼지`;
}

  const box = $('top10List');
  if(!state.race?.order?.length){
    box.textContent = '레이스 대기중';
    return;
  }
  box.innerHTML = state.race.order.slice(0,10).map((r,i)=>`
    <div class="top10Row ${r.nickname===selectedPigName?'me':''}">
      <span>${i+1}등</span><span>${esc(r.nickname)}</span>
    </div>
  `).join('');
}

function findMyPig(){
  const q = $('myPigName').value.trim();
  if(!q) return alert('내 닉네임을 입력하세요.');
  const exact = state.racers.find(r=>r.nickname===q);
  const partials = state.racers.filter(r=>r.nickname.toLowerCase().includes(q.toLowerCase()));
  let target = exact;
  if(!target && partials.length===1) target = partials[0];
  if(!target){
    if(partials.length>1) return alert('비슷한 닉네임이 여러 개 있습니다. 정확한 닉네임을 입력하세요.');
    return alert('참가자 명단에서 해당 닉네임을 찾지 못했습니다.');
  }
  selectedPigName = target.nickname;
  cameraMode = 'mine';
  localStorage.setItem('galvent_my_pig', selectedPigName);
  $('myPigName').value = selectedPigName;

  // TOP10 밖 참가자여도 내 돼지는 3D 장면에 추가
  lastSignature = '';
  buildWorld();
  refreshMyPigSelection();
  updateMyPigBadge();
  renderTop10();
}

function showAllPigs(){

  $('myPigBadge').style.display = 'none';

function updateCamera(){
  if(cameraMode !== 'mine' || !selectedPigName) return;
  const pig = pigs.find(p=>p.userData.name===selectedPigName);
  if(!pig) return;

  const pos = new THREE.Vector3();
  pig.getWorldPosition(pos);

  const desired = new THREE.Vector3(pos.x - 6.8,pos.y + 3.2,pos.z + 6.8);
  camera.position.lerp(desired,0.075);

  const look = new THREE.Vector3(pos.x + 2.2,pos.y + 0.35,pos.z);

  const sig = JSON.stringify({
    racers: state.racers.map(r=>r.nickname),
    startedAt: state.race?.startedAt || 0,
    selectedPigName
  });
  if(sig !== lastSignature){

  }

function updateOverlay(){
  if(!state.race){
    $('timer').textContent = '대기 중';
    return;
  }
  const elapsed = Date.now() - state.race.startedAt;
  const left = Math.max(0, durationMs - elapsed);
  $('timer').textContent = left > 0 ? `⏱ ${(left/1000).toFixed(1)}초` : '🏁 FINISH!';
  if(left <= 0 && state.race.winner && !finishShown){
    finishShown = true;
    $('winnerBanner').style.display = 'block';
    $('winnerBanner').textContent = `🏆 1등 ${state.race.winner} 🐷 춤 타임!`;
  }
}

function animatePig(pig, elapsedSec, rankMap){
  const data = pig.userData;
  const rig = data.rig;
  const total = Math.max(1,state.racers.length);
  const place = rankMap.get(data.name) || (data.index+1);

  let progress = 0;
  if(state.race){
    progress = Math.min(1,Math.max(0,(Date.now()-state.race.startedAt)/durationMs));
  }

  const phase = elapsedSec*9.4 + data.seed*1.45;
  const stride = Math.sin(phase);
  let x = data.startX;
  let winnerDance = false;

  if(state.race){
    const finishBias = place===1
      ? 1.018
      : 0.91-((place-2)/Math.max(1,total-1))*0.25;

    const wobble = Math.sin(elapsedSec*3.0+data.seed*4.3)*(1-progress)*0.30;
    const pct = progress<1
      ? Math.max(0,Math.min(1,progress*finishBias+wobble*0.014))
      : (place===1 ? 1.025 : Math.max(0.80,0.985-place*0.0024));

    x = THREE.MathUtils.lerp(data.startX,data.finishX,pct);

    if(progress>=1 && place===1){
      winnerDance = true;
      x = data.finishX+0.7;
    }
  }

  pig.position.x = x;
  pig.position.z = data.laneZ;

  // 모든 돼지는 항상 +X 결승선을 바라본다.
  data.facing.rotation.y = Math.PI/2;

  if(winnerDance){
    pig.position.y = data.baseY + Math.abs(Math.sin(elapsedSec*6.0))*0.10;
    pig.rotation.z = Math.sin(elapsedSec*6.5)*0.05;

    // 골인 후 팔을 들고 춤. rest/model-space 기준이라 몸이 찢어지지 않음.
    setBoneModelPose(rig,'armL',-0.25,-0.55);
    setBoneModelPose(rig,'armR', 0.25, 0.55);
    setBoneModelPose(rig,'forearmL',-0.55,-0.55);
    setBoneModelPose(rig,'forearmR',-0.55, 0.55);
    setBoneModelPose(rig,'thighL', Math.sin(elapsedSec*6)*0.20,0);
    setBoneModelPose(rig,'thighR',-Math.sin(elapsedSec*6)*0.20,0);
    return;
  }

  const moving = state.race ? 1 : 0.06;

  // 몸 전체는 발이 땅에서 뜬 것처럼 보이지 않을 정도로만 위아래 움직임
  pig.position.y = data.baseY + Math.max(0,Math.sin(phase*2))*0.035*moving;
  pig.rotation.z = -0.035*moving;

  /*
    실제 Piggu rest pose는 팔이 좌우로 펼쳐져 있음.
    모델 좌표:
      +Z = 얼굴/진행방향
      +Y = 위
      +X = 좌우

    1) Z축 ±90°로 양팔을 자연스럽게 아래로 내림
    2) X축으로 앞/뒤 교차 스윙
    3) 다리도 X축으로 반대 위상 스윙
  */
  const leftArmSwing  =  stride*0.48*moving;   // 왼팔 뒤/앞
  const rightArmSwing = -stride*0.48*moving;   // 오른팔 반대
  const leftLegSwing  = -stride*0.56*moving;   // 왼다리 앞/뒤
  const rightLegSwing =  stride*0.56*moving;   // 오른다리 반대

  // 팔: rest T-pose -> 아래로 -> 사람 달리기처럼 교차
  setBoneModelPose(rig,'armL',leftArmSwing,-Math.PI/2);
  setBoneModelPose(rig,'armR',rightArmSwing, Math.PI/2);

  // 팔꿈치는 기본적으로 약 55~65도 굽힌 자세
  setBoneModelPose(rig,'forearmL',leftArmSwing-0.72,-Math.PI/2);
  setBoneModelPose(rig,'forearmR',rightArmSwing-0.72, Math.PI/2);

  // 허벅지
  setBoneModelPose(rig,'thighL',leftLegSwing,0);
  setBoneModelPose(rig,'thighR',rightLegSwing,0);

  // 뒤로 빠지는 다리는 무릎을 크게 굽힘
  const kneeL = (0.10 + Math.max(0,-stride)*0.72)*moving;
  const kneeR = (0.10 + Math.max(0, stride)*0.72)*moving;

  setBoneModelPose(rig,'legL',leftLegSwing+kneeL,0);
  setBoneModelPose(rig,'legR',rightLegSwing+kneeR,0);

  // 발은 무릎에 그대로 끌려가지 않도록 살짝 보정
  setBoneModelPose(rig,'footL',leftLegSwing+kneeL*0.18,0);
  setBoneModelPose(rig,'footR',rightLegSwing+kneeR*0.18,0);
}

function updateNameLabels(){
  if(!camera || !renderer) return;
  const wrap = $('sceneWrap');
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  const order = state.race?.order || [];
  const placeMap = new Map(order.map(x=>[x.nickname,x.place]));

  for(const pig of pigs){
    const d = pig.userData;
    const el = d.labelEl;
    if(!el) continue;

    pig.getWorldPosition(_tmpV);
    _tmpV.y += Math.max(1.0,d.displayHeight+0.25);
    _tmpV.project(camera);

    const onScreen =
      _tmpV.z>-1 && _tmpV.z<1 &&
      _tmpV.x>-1.08 && _tmpV.x<1.08 &&
      _tmpV.y>-1.10 && _tmpV.y<1.10;

    if(!onScreen){
      el.style.display = 'none';
      continue;
    }

    const x = (_tmpV.x*0.5+0.5)*w;
    const y = (-_tmpV.y*0.5+0.5)*h;
    el.style.display = 'block';
    el.style.transform = `translate(-50%,-100%) translate(${x}px,${y}px)`;

    const place = placeMap.get(d.name);
    el.className = 'pigNameTag' +
      (place && place<=10 ? ' top10' : '') +
      (d.name===selectedPigName ? ' mine' : '');

    if(d.name===selectedPigName){
      el.textContent = `⭐ ${place ? place+'등 · ' : ''}${d.name}`;
    }else if(place && place<=10){
      el.textContent = `${place}등 · ${d.name}`;
    }else{
      el.textContent = d.name;
    }
  }
}

function updateAllCamera(){
  if(cameraMode !== 'all' || !pigs.length) return;

  const focusX = pigs.reduce((a,p)=>a+p.position.x,0)/pigs.length;
  const visualDepth = Math.max(26,pigs.length*2.45+7);

  // 결승선 앞쪽의 3/4 TV 카메라:
  // 얼굴/눈 + 발끝까지 전신 + TOP10 라인이 같이 들어오게 여유 있게 잡음.
  const desired = new THREE.Vector3(
    focusX+24,
    8.3,
    Math.max(22,visualDepth*0.80)
  );

  camera.position.lerp(desired,0.045);
  camera.lookAt(focusX+1.5,-0.10,0);
}

let lastPerfFrame = 0;
let perfTick = 0;

function animate(now=0){
  requestAnimationFrame(animate);

  // 30fps 제한: 참가자가 많아도 브라우저가 과하게 GPU/CPU를 쓰지 않게 함
  if(now - lastPerfFrame < 33) return;
  lastPerfFrame = now;
  perfTick++;

  const t = clock.getElapsedTime();
  updateOverlay();
  const rankMap = new Map((state.race?.order || []).map(x=>[x.nickname,x.place]));
  pigs.forEach(p => animatePig(p,t,rankMap));
  updateCamera();
  updateAllCamera();

  if(perfTick % 3 === 0){
    updateNameLabels();
  }
  if(perfTick % 9 === 0){
    updateMyPigBadge();
  }

  renderer.render(scene,camera);
}

async function poll(){
  try{
    state = await api('/api/state');
    maybeRebuildWorld();
    updateOverlay();
    setStatus(`참가자 ${state.racers.length} / 200명`);
    if(!state.race){
      setSub('댓글을 불러온 뒤 레이스를 시작할 수 있습니다.');
    }else{
      const elapsed = Date.now() - state.race.startedAt;
      if(elapsed < durationMs){
        setSub('레이스 진행 중...');
      }else{
        setSub(`레이스 종료 · 1등 ${state.race.winner}`);
      }
    }
  }catch(e){
    setSub('서버 연결을 확인하세요.');
  }
}

async function loadComments(){

  const url = $('post').value.trim();
  if(!key) return alert('ADMIN_KEY를 입력하세요.');
  if(!url) return alert('디시 게시글 주소를 입력하세요.');
  setSub('댓글 참가자 불러오는 중...');
  try{
    const d = await api('/api/admin/import',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + key},
      body:JSON.stringify({url})
    });
    await poll();
    alert(`댓글 ${d.commentCount ?? '-'}개 / 참가자 ${d.count}명 불러왔습니다.`);
    setSub(`댓글 ${d.commentCount ?? '-'}개 → 참가자 ${d.count}명`);
  }catch(e){
    alert(e.message);
    setSub(e.message);
  }
}

async function startRace(){
  const key = $('key').value.trim();
  if(!key) return alert('ADMIN_KEY를 입력하세요.');
  if(!state.racers.length) return alert('먼저 댓글을 불러오세요.');
  if(!confirm(`${state.racers.length}명으로 30초 레이스를 시작할까요?`)) return;
  try{
    await api('/api/admin/start',{
      method:'POST',
      headers:{'Authorization':'Bearer ' + key}
    });
    finishShown = false;
    $('winnerBanner').style.display = 'none';
    await poll();

    if(musicEnabled){
      try{
        bgm.currentTime = 0;
        await bgm.play();
      }catch(e){
        console.log('음악 자동재생 차단 또는 파일 없음');
      }
    }
  }catch(e){
    alert(e.message);
  }
}

async function resetRace(){
  const key = $('key').value.trim();
  if(!key) return alert('ADMIN_KEY를 입력하세요.');
  if(!confirm('참가자와 레이스를 전부 초기화할까요?')) return;
  try{
    await api('/api/admin/reset',{
      method:'POST',
      headers:{'Authorization':'Bearer ' + key}
    });
    bgm.pause();
    bgm.currentTime = 0;
    finishShown = false;
    state = {racers:[],race:null};
    lastSignature = '';
    await poll();
  }catch(e){
    alert(e.message);
  }
}

function toggleMusic(){
  musicEnabled = !musicEnabled;
  $('musicBtn').textContent = musicEnabled ? '🎵 음악 ON' : '🔇 음악 OFF';
  if(!musicEnabled){
    bgm.pause();
  }else if(state.race && (Date.now() - state.race.startedAt) < durationMs){
    bgm.play().catch(()=>{});
  }
}

window.loadComments = loadComments;
window.startRace = startRace;
window.resetRace = resetRace;
window.toggleMusic = toggleMusic;
window.findMyPig = findMyPig;
window.showAllPigs = showAllPigs;

initScene();
loadPigModel();
if(selectedPigName) $('myPigName').value = selectedPigName;
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
