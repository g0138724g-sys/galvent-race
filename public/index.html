<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>갤벤 레이스</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:linear-gradient(#78c9ff 0 45%,#79c95b 45%);min-height:100vh;color:#222}.wrap{max-width:1100px;margin:auto;padding:25px 15px}.title{text-align:center;font-size:42px;font-weight:900;margin:5px 0 8px}.sub{text-align:center;margin-bottom:20px}.panel{background:#ffffffea;border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:0 5px 18px #0002}.admin{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.admin input{padding:12px;border:2px solid #ddd;border-radius:12px;font-size:15px}.url{width:min(600px,100%)}button{border:0;border-radius:12px;padding:12px 17px;font-weight:800;font-size:15px;cursor:pointer}.load{background:#ffd85c}.start{background:#ff7f7f}.reset{background:#ddd}.status{text-align:center;font-weight:800;margin-top:12px}.timer{text-align:center;font-size:28px;font-weight:900;margin:12px}.track{background:#b77b47;border:5px solid #fff;border-radius:18px;overflow:hidden}.lane{position:relative;height:54px;border-bottom:1px dashed #ffffff88}.lane:last-child{border:0}.pig{position:absolute;left:8px;top:7px;font-size:34px;transition:left .25s linear;white-space:nowrap}.pig span{font-size:12px;background:#fff;padding:3px 6px;border-radius:8px;margin-left:4px;vertical-align:middle}.winner{text-align:center;font-size:30px;font-weight:900;padding:12px}.list{max-height:260px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.person{background:#f5f5f5;border-radius:9px;padding:7px;font-size:13px}.note{text-align:center;font-size:13px;color:#666;margin-top:8px}@media(max-width:600px){.title{font-size:31px}.admin{display:block}.admin input,.admin button{width:100%;margin:4px 0}.lane{height:49px}.pig{font-size:30px}}</style></head><body><div class="wrap"><div class="title">🏁 갤벤 레이스 🐷</div><div class="sub">디시 갤벤 글 댓글 작성자가 자동으로 레이스에 참가합니다.</div><div class="panel"><div class="admin"><input id="key" type="password" placeholder="운영자 ADMIN_KEY"><input id="post" class="url" placeholder="디시 갤벤 게시글 주소"><button class="load" onclick="loadComments()">🐷 현재 댓글 불러오기</button><button class="start" onclick="startRace()">🏁 레이스 시작</button><button class="reset" onclick="resetRace()">초기화</button></div><div id="status" class="status">참가자 0 / 200명</div><div class="note">댓글을 불러온 시점의 작성자만 참가합니다. 레이스 시작 전에 참가자 명단을 확인하세요.</div></div><div class="panel"><div id="timer" class="timer">대기 중</div><div id="winner" class="winner"></div><div id="track" class="track"></div></div><div class="panel"><b>🐷 참가자 명단</b><div id="list" class="list"></div></div></div><script>let state={racers:[],race:null},anim=null;const $=x=>document.getElementById(x),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch(url,opt),d=await r.json().catch(()=>({error:'서버 응답 오류'}));if(!r.ok)throw Error(d.error||'오류가 발생했습니다.');return d}async function loadComments(){const key=$('key').value.trim(),url=$('post').value.trim();if(!key)return alert('ADMIN_KEY를 입력하세요.');if(!url)return alert('디시 게시글 주소를 입력하세요.');$('status').textContent='댓글 불러오는 중...';try{const d=await api('/api/admin/import',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({url})});await poll();alert('현재 댓글 작성자 '+d.count+'명 불러왔습니다. 참가자 명단을 확인하세요.')}catch(e){alert(e.message);await poll()}}async function startRace(){const key=$('key').value.trim();if(!key)return alert('ADMIN_KEY를 입력하세요.');if(!state.racers.length)return alert('먼저 댓글 참가자를 불러오세요.');if(!confirm(state.racers.length+'명으로 레이스를 시작할까요?'))return;try{await api('/api/admin/start',{method:'POST',headers:{'Authorization':'Bearer '+key}});await poll()}catch(e){alert(e.message)}}async function resetRace(){const key=$('key').value.trim();if(!key)return alert('ADMIN_KEY를 입력하세요.');if(!confirm('참가자와 레이스 결과를 모두 초기화할까요?'))return;try{await api('/api/admin/reset',{method:'POST',headers:{'Authorization':'Bearer '+key}});await poll()}catch(e){alert(e.message)}}async function poll(){try{state=await api('/api/state');draw()}catch{}}function draw(){$('status').textContent='참가자 '+state.racers.length+' / 200명';$('list').innerHTML=state.racers.map((r,i)=>'<div class="person">'+(i+1)+'. '+esc(r.nickname)+'</div>').join('');const track=$('track');track.innerHTML=state.racers.map(r=>'<div class="lane"><div class="pig" id="p'+r.id+'">🐷 <span>'+esc(r.nickname)+'</span></div></div>').join('');if(!state.race){$('timer').textContent='대기 중';$('winner').textContent='';return}const elapsed=(Date.now()-state.race.startedAt)/1000,left=Math.max(0,30-elapsed);$('timer').textContent=left>0?'⏱ '+left.toFixed(1)+'초':'🏁 FINISH!';const ranks=new Map(state.race.order.map(x=>[x.nickname,x.place]));for(const r of state.racers){const p=$('p'+r.id),place=ranks.get(r.nickname)||state.racers.length,finish=place===1?92:Math.max(8,89-(place-2)*(78/Math.max(1,state.racers.length-2))),t=Math.min(1,elapsed/30),wave=Math.sin((elapsed*2.8)+(r.id*1.7))*4*(1-t),pct=Math.max(1,Math.min(94,finish*t+wave));if(p)p.style.left='calc('+pct+'% - 35px)'}if(left<=0){$('winner').textContent='🏆 1등 : '+state.race.winner+' 🐷';if(anim){clearInterval(anim);anim=null}}else if(!anim)anim=setInterval(poll,250)}poll();setInterval(poll,1500);</script></body></html>
